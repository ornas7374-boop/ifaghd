<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>خريطة كلود</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"></noscript>
<style>
:root{
  color-scheme: light;
  --paper:#F5F5F9; --paper2:#EFEFF5; --surface:#FFFFFF; --surface2:#FBFBFD;
  --ink:#15161C; --ink2:#383B4B; --muted:#6C6F81; --faint:#9A9DAD;
  --line:#E3E3EC; --line2:#EDEDF3; --line3:#F4F4F8;
  --indigo:#2B3A8C; --indigo-s:#ECEEFA; --indigo-b:#C7CDEE;
  --ochre:#B4653A; --ochre-s:#FAF0E8; --ochre-b:#EDD3BF;
  --sky:#22648F; --sky-s:#E9F1F7; --sky-b:#C2D8E7;
  --teal:#1A6F62; --teal-s:#E6F1EF; --teal-b:#BCDBD5;
  --plum:#71356A; --plum-s:#F5EBF4; --plum-b:#E0C7DD;
  --rose:#9C2E44; --rose-s:#FAEAEE; --rose-b:#EFC8D1;
  --ok:#1A6F62; --warn:#9A6B18; --bad:#9C2E44;
  --r-s:6px; --r-m:10px; --r-l:16px; --r-xl:22px;
  --sh-1:0 1px 2px rgba(21,22,28,.05);
  --sh-2:0 2px 6px rgba(21,22,28,.06),0 10px 28px rgba(21,22,28,.06);
  --sh-3:0 18px 60px rgba(21,22,28,.16);
  --fd:'Noto Kufi Arabic','Segoe UI',system-ui,sans-serif;
  --fb:'IBM Plex Sans Arabic','Segoe UI',system-ui,sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --side:270px; --bar:64px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--fb);font-size:15px;line-height:1.75;
  direction:rtl;text-align:right;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--fd);font-weight:600;line-height:1.4;margin:0;text-wrap:balance}
p{margin:0}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--indigo);text-decoration:none}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px;border-radius:4px}
.en{font-family:var(--fm);font-size:.8em;letter-spacing:.01em;direction:ltr;unicode-bidi:isolate;color:var(--muted);font-weight:400}
.num{font-family:var(--fm);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{
  grid-column:1;background:var(--surface);border-inline-start:1px solid var(--line);
  position:sticky;top:0;height:100vh;overflow-y:auto;overscroll-behavior:contain;
  display:flex;flex-direction:column;gap:2px;padding:18px 14px 26px;
}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px;margin-bottom:8px;border-bottom:1px solid var(--line2)}
.brand-mark{width:38px;height:38px;border-radius:11px;background:var(--ink);display:grid;place-items:center;flex:none;box-shadow:var(--sh-1)}
.brand-mark svg{width:21px;height:21px;stroke:#fff}
.brand-t{font-family:var(--fd);font-weight:700;font-size:16px;letter-spacing:-.01em}
.brand-s{font-size:11px;color:var(--faint);font-family:var(--fm);letter-spacing:.04em;text-transform:uppercase}
.nav-h{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-family:var(--fm);padding:16px 10px 7px}
.nav-i{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-m);color:var(--ink2);font-size:14px;width:100%;text-align:right;transition:background .16s,color .16s}
.nav-i svg{width:17px;height:17px;stroke:var(--faint);flex:none;transition:stroke .16s}
.nav-i:hover{background:var(--line3);color:var(--ink)}
.nav-i:hover svg{stroke:var(--ink2)}
.nav-i.on{background:var(--indigo-s);color:var(--indigo);font-weight:600}
.nav-i.on svg{stroke:var(--indigo)}
.nav-i .pill{margin-inline-start:auto;font-family:var(--fm);font-size:10.5px;color:var(--faint)}
.side-foot{margin-top:auto;padding:16px 10px 0;border-top:1px solid var(--line2);font-size:11.5px;color:var(--faint);line-height:1.7}

.mainwrap{grid-column:2;display:flex;flex-direction:column;min-width:0}
.bar{
  position:sticky;top:0;z-index:40;height:var(--bar);background:rgba(245,245,249,.86);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 22px;
}
.burger{display:none;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);place-items:center}
.burger svg{width:17px;height:17px;stroke:var(--ink2)}
.crumb{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);min-width:0}
.crumb b{font-weight:600;color:var(--ink);font-family:var(--fd);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb span{color:var(--faint)}
.search-wrap{margin-inline-start:auto;position:relative;width:min(340px,42vw)}
.search{
  width:100%;height:38px;border:1px solid var(--line);background:var(--surface);border-radius:10px;
  padding:0 36px 0 12px;font-family:var(--fb);font-size:13.5px;color:var(--ink);transition:border-color .16s,box-shadow .16s;
}
.search::placeholder{color:var(--faint)}
.search:focus{outline:none;border-color:var(--indigo-b);box-shadow:0 0 0 3px var(--indigo-s)}
.search-ic{position:absolute;inset-inline-start:11px;top:10px;width:17px;height:17px;stroke:var(--faint);pointer-events:none}
.ring{display:flex;align-items:center;gap:9px;flex:none}
.ring svg{width:34px;height:34px;transform:rotate(-90deg)}
.ring .r-bg{fill:none;stroke:var(--line);stroke-width:3.5}
.ring .r-fg{fill:none;stroke:var(--indigo);stroke-width:3.5;stroke-linecap:round;transition:stroke-dasharray .5s ease}
.ring b{font-family:var(--fm);font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.ring small{display:block;font-size:10px;color:var(--faint);font-family:var(--fm);letter-spacing:.05em}

.view{padding:30px 30px 90px;max-width:1120px;width:100%}
.view.wide{max-width:none;padding:0}

/* ---------- typography blocks ---------- */
.eyebrow{font-family:var(--fm);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.h-page{font-size:31px;font-weight:700;letter-spacing:-.02em;margin-top:7px}
.h-sec{font-size:20px;font-weight:600;letter-spacing:-.01em}
.h-sub{font-size:15.5px;font-weight:600}
.lede{font-size:16px;color:var(--ink2);max-width:66ch;margin-top:11px;line-height:1.85}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:flex;flex-direction:column}
.gap-6{gap:6px}.gap-10{gap:10px}.gap-14{gap:14px}.gap-18{gap:18px}.gap-26{gap:26px}.gap-38{gap:38px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.divider{height:1px;background:var(--line);border:0;margin:0}
.sec-head{display:flex;align-items:baseline;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.sec-head .en{margin-inline-start:auto}

/* ---------- chips / tags ---------- */
.tag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:500;border:1px solid transparent;white-space:nowrap}
.tag.lv1{background:var(--teal-s);color:var(--teal);border-color:var(--teal-b)}
.tag.lv2{background:var(--ochre-s);color:var(--ochre);border-color:var(--ochre-b)}
.tag.lv3{background:var(--rose-s);color:var(--rose);border-color:var(--rose-b)}
.tag.plain{background:var(--line3);color:var(--muted);border-color:var(--line)}
.tag.done{background:var(--teal);color:#fff;border-color:var(--teal)}
.dot{width:7px;height:7px;border-radius:50%;flex:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 17px;border-radius:10px;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);transition:background .16s,border-color .16s,transform .12s,box-shadow .16s;font-family:var(--fd)}
.btn:hover{border-color:var(--faint);box-shadow:var(--sh-1)}
.btn:active{transform:translateY(1px)}
.btn svg{width:16px;height:16px;stroke:currentColor}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.pri:hover{background:#22242E}
.btn.acc{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.btn.ok{background:var(--teal);color:#fff;border-color:var(--teal)}
.btn.sm{height:32px;padding:0 12px;font-size:12.5px;border-radius:8px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--line3);color:var(--ink);box-shadow:none}

/* ---------- cards ---------- */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:18px}
.card.flat{background:var(--surface2);box-shadow:none}
.card.pad-s{padding:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:17px;text-align:right;display:flex;flex-direction:column;gap:8px;transition:border-color .18s,box-shadow .18s,transform .18s;width:100%}
button.tile:hover{border-color:var(--indigo-b);box-shadow:var(--sh-2);transform:translateY(-2px)}
.tile-top{display:flex;align-items:center;gap:10px}
.ic-box{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;border:1px solid}
.ic-box svg{width:17px;height:17px;stroke-width:1.7}
.plate{margin-inline-start:auto;font-family:var(--fm);font-size:11px;color:var(--faint);letter-spacing:.06em}

/* cluster colors */
.cA .ic-box{background:var(--indigo-s);border-color:var(--indigo-b)} .cA .ic-box svg{stroke:var(--indigo)}
.cB .ic-box{background:var(--ochre-s);border-color:var(--ochre-b)} .cB .ic-box svg{stroke:var(--ochre)}
.cC .ic-box{background:var(--sky-s);border-color:var(--sky-b)} .cC .ic-box svg{stroke:var(--sky)}
.cD .ic-box{background:var(--teal-s);border-color:var(--teal-b)} .cD .ic-box svg{stroke:var(--teal)}
.cE .ic-box{background:var(--plum-s);border-color:var(--plum-b)} .cE .ic-box svg{stroke:var(--plum)}
.cF .ic-box{background:var(--rose-s);border-color:var(--rose-b)} .cF .ic-box svg{stroke:var(--rose)}

/* ---------- map ---------- */
.mapview{position:relative;height:calc(100vh - var(--bar));overflow:hidden;background:
  radial-gradient(circle at 50% 46%, rgba(43,58,140,.05) 0 1px, transparent 1px 92px),
  radial-gradient(circle at 50% 46%, rgba(43,58,140,.035) 0 1px, transparent 1px 46px),
  linear-gradient(180deg,#F8F8FB,#F1F1F7);
  background-size:auto,auto,auto;cursor:grab;touch-action:none}
.mapview.drag{cursor:grabbing}
.stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.stage svg.links{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.stage svg.links path{fill:none;stroke:var(--line);stroke-width:1.6;transition:stroke .2s,stroke-width .2s,opacity .2s}
.stage svg.links path.hl{stroke-width:2.6}
.stage svg.links path.dim{opacity:.25}
.node{position:absolute;transform:translate(-50%,-50%);transition:opacity .2s}
.node.dim{opacity:.32}
.n-core{
  width:190px;height:190px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-content:center;
  text-align:center;gap:4px;box-shadow:0 22px 60px rgba(21,22,28,.28);border:6px solid #fff;padding:10px;
}
.n-core .t{font-family:var(--fd);font-size:26px;font-weight:700;letter-spacing:-.01em}
.n-core .s{font-size:11.5px;color:#B9BCCB;line-height:1.6;max-width:140px;margin:0 auto}
.n-core .k{font-family:var(--fm);font-size:10px;letter-spacing:.16em;color:#7C8098;text-transform:uppercase}
.n-hub{
  min-width:150px;padding:11px 15px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);
  text-align:center;box-shadow:var(--sh-2);
}
.n-hub .t{font-family:var(--fd);font-size:14.5px;font-weight:600}
.n-hub .s{font-size:10.5px;font-family:var(--fm);color:var(--faint)}
.n-topic{
  width:176px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);
  text-align:right;box-shadow:var(--sh-1);display:flex;gap:9px;align-items:center;
  transition:transform .18s,box-shadow .18s,border-color .18s;
}
.n-topic:hover{transform:translateY(-3px) scale(1.03);box-shadow:var(--sh-2)}
.n-topic .tt{font-family:var(--fd);font-size:12.5px;font-weight:600;line-height:1.45}
.n-topic .te{font-family:var(--fm);font-size:9.5px;color:var(--faint);direction:ltr;text-align:right;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n-topic .sq{width:9px;height:9px;border-radius:3px;flex:none}
.n-topic .chk{width:15px;height:15px;border-radius:50%;display:none;place-items:center;background:var(--teal);flex:none;margin-inline-start:auto}
.n-topic .chk svg{width:9px;height:9px;stroke:#fff;stroke-width:3}
.n-topic.done{border-color:var(--teal-b);background:linear-gradient(0deg,var(--teal-s),var(--teal-s))}
.n-topic.done .chk{display:grid}
.map-ui{position:absolute;z-index:20;display:flex;gap:8px}
.map-ui.tl{top:16px;inset-inline-start:16px;flex-direction:column;align-items:flex-start}
.map-ui.bl{bottom:16px;inset-inline-start:16px}
.map-ui.br{bottom:16px;inset-inline-end:16px;flex-direction:column;align-items:flex-end}
.zoom{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--sh-1)}
.zoom button{width:34px;height:32px;display:grid;place-items:center;border-bottom:1px solid var(--line2)}
.zoom button:last-child{border-bottom:0}
.zoom button:hover{background:var(--line3)}
.zoom svg{width:15px;height:15px;stroke:var(--ink2)}
.legend{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:12px;padding:11px 13px;box-shadow:var(--sh-1);backdrop-filter:blur(6px)}
.legend .lh{font-family:var(--fm);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.legend button{display:flex;align-items:center;gap:8px;font-size:12px;padding:3px 0;width:100%;text-align:right;color:var(--ink2);transition:opacity .15s}
.legend button.off{opacity:.35}
.map-hint{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:11.5px;color:var(--muted);box-shadow:var(--sh-1)}

/* ---------- topic detail ---------- */
.t-hero{display:flex;gap:16px;align-items:flex-start;padding-bottom:20px;border-bottom:1px solid var(--line)}
.t-hero .ic-box{width:46px;height:46px;border-radius:13px}
.t-hero .ic-box svg{width:22px;height:22px}
.block{border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);overflow:hidden}
.block-h{display:flex;align-items:center;gap:10px;padding:13px 17px;border-bottom:1px solid var(--line2);background:var(--surface2)}
.block-h .k{font-family:var(--fm);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.block-h h3{font-size:15px}
.block-b{padding:17px}
.lst{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.lst li{display:flex;gap:9px;font-size:14px;color:var(--ink2);line-height:1.7}
.lst li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--faint);margin-top:10px;flex:none}
.lst.ok li::before{background:var(--teal)}
.lst.no li::before{background:var(--rose)}
.lst.warn li::before{background:var(--ochre)}
.pre{background:#15161C;color:#E7E8EF;border-radius:12px;padding:15px 16px;font-family:var(--fm);font-size:12.5px;line-height:1.85;direction:ltr;text-align:left;overflow-x:auto;white-space:pre-wrap;word-break:break-word}
.pre.rtl{direction:rtl;text-align:right}
.pre b{color:#F0B27A;font-weight:500}
.copy-wrap{position:relative}
.copy-btn{position:absolute;top:9px;inset-inline-end:9px;background:rgba(255,255,255,.09);color:#C9CBD8;border-radius:7px;padding:4px 9px;font-size:11px;font-family:var(--fm)}
.copy-btn:hover{background:rgba(255,255,255,.18);color:#fff}
.rel-grid{display:flex;flex-wrap:wrap;gap:8px}
.rel{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;background:var(--surface);transition:border-color .16s,background .16s}
.rel:hover{border-color:var(--indigo-b);background:var(--indigo-s)}

/* chain diagram */
.chain{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chain .step{display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border-radius:11px;border:1px solid var(--line);background:var(--surface2);font-size:13px;font-weight:500;transition:.16s;font-family:var(--fd)}
.chain .step .i{font-family:var(--fm);font-size:10px;color:var(--faint)}
.chain .step:hover{border-color:var(--indigo-b);background:var(--indigo-s)}
.chain .step.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chain .step.on .i{color:#9A9DB5}
.chain .arw{color:var(--faint);font-family:var(--fm);font-size:13px}
.chain-note{margin-top:14px;border:1px solid var(--line);border-inline-start:3px solid var(--indigo);border-radius:12px;padding:14px 16px;background:var(--surface2);font-size:14px;color:var(--ink2);line-height:1.8}
.chain-note b{color:var(--ink);font-weight:600}

/* loop diagram */
.loopwrap{position:relative;width:100%;max-width:520px;aspect-ratio:1;margin:0 auto}
.loopwrap .ring-svg{position:absolute;inset:0;width:100%;height:100%}
.loopwrap .lnode{position:absolute;transform:translate(-50%,-50%);width:108px;padding:8px 6px;border-radius:11px;border:1px solid var(--line);background:var(--surface);text-align:center;font-size:12px;font-weight:600;font-family:var(--fd);box-shadow:var(--sh-1);transition:.16s}
.loopwrap .lnode:hover{border-color:var(--teal-b);background:var(--teal-s)}
.loopwrap .lnode.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.loopwrap .lnode small{display:block;font-family:var(--fm);font-size:9px;color:var(--faint);font-weight:400}
.loopwrap .lnode.on small{color:#BFE0D9}
.loop-center{position:absolute;inset:26%;border-radius:50%;background:var(--surface);border:1px dashed var(--line);display:grid;place-content:center;text-align:center;padding:14px;font-size:12.5px;color:var(--muted);line-height:1.7}

/* quiz */
.quiz-q{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--surface)}
.quiz-q .qt{font-family:var(--fd);font-weight:600;font-size:14.5px;margin-bottom:12px;display:flex;gap:9px}
.quiz-q .qt .qn{font-family:var(--fm);font-size:12px;color:var(--faint);flex:none;padding-top:2px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:right;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:var(--surface2);font-size:13.5px;transition:.15s;margin-bottom:8px;line-height:1.65}
.opt:hover{border-color:var(--indigo-b);background:var(--indigo-s)}
.opt .mk{width:19px;height:19px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;font-family:var(--fm);font-size:10px;color:var(--muted);margin-top:1px}
.opt.right{background:var(--teal-s);border-color:var(--teal-b);color:var(--teal)}
.opt.right .mk{background:var(--teal);border-color:var(--teal);color:#fff}
.opt.wrong{background:var(--rose-s);border-color:var(--rose-b);color:var(--rose)}
.opt.wrong .mk{background:var(--rose);border-color:var(--rose);color:#fff}
.opt.locked{pointer-events:none}
.why{border-radius:11px;padding:12px 14px;font-size:13.5px;line-height:1.8;background:var(--indigo-s);border:1px solid var(--indigo-b);color:var(--ink2)}
.why b{color:var(--indigo)}

/* progress bars */
.bar-track{height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:var(--indigo);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar-fill.teal{background:var(--teal)} .bar-fill.ochre{background:var(--ochre)}
.bar-fill.plum{background:var(--plum)} .bar-fill.sky{background:var(--sky)} .bar-fill.rose{background:var(--rose)}
.pline{display:flex;align-items:center;gap:12px}
.pline .pl-t{font-size:13.5px;min-width:150px}
.pline .pl-v{font-family:var(--fm);font-size:12px;color:var(--muted);min-width:52px;text-align:left;font-variant-numeric:tabular-nums}

/* accordion */
.acc{border:1px solid var(--line);border-radius:13px;background:var(--surface);overflow:hidden}
.acc+.acc{margin-top:8px}
.acc-h{display:flex;align-items:center;gap:11px;width:100%;text-align:right;padding:13px 16px;font-family:var(--fd);font-weight:600;font-size:14.5px;transition:background .15s}
.acc-h:hover{background:var(--surface2)}
.acc-h .cv{margin-inline-start:auto;color:var(--faint);transition:transform .22s;flex:none}
.acc-h .cv svg{width:15px;height:15px;stroke:currentColor}
.acc.open .acc-h .cv{transform:rotate(180deg)}
.acc-b{padding:0 16px 16px;font-size:14px;color:var(--ink2);line-height:1.8}
.acc:not(.open) .acc-b{display:none}

/* tabs */
.tabs{display:flex;gap:4px;padding:4px;background:var(--paper2);border-radius:12px;width:fit-content;max-width:100%;overflow-x:auto}
.tabs button{padding:8px 15px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap;font-family:var(--fd);transition:.15s}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}

/* table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:13.5px}
th,td{padding:11px 14px;text-align:right;border-bottom:1px solid var(--line2);vertical-align:top}
th{background:var(--surface2);font-family:var(--fd);font-weight:600;font-size:12.5px;color:var(--ink2);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td .en{display:block;margin-top:2px}

/* search results */
.res{display:flex;align-items:center;gap:12px;width:100%;text-align:right;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);transition:.15s}
.res:hover{border-color:var(--indigo-b);box-shadow:var(--sh-1)}
.res .rt{font-family:var(--fd);font-weight:600;font-size:14px}
.res .rm{font-size:11.5px;color:var(--faint);font-family:var(--fm)}

.badge{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;padding:18px 12px;border-radius:var(--r-l);border:1px dashed var(--line);background:var(--surface2);transition:.2s}
.badge.won{border-style:solid;border-color:var(--ochre-b);background:var(--ochre-s)}
.badge .bi{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--line3);border:1px solid var(--line)}
.badge.won .bi{background:#fff;border-color:var(--ochre-b)}
.badge .bi svg{width:20px;height:20px;stroke:var(--faint)}
.badge.won .bi svg{stroke:var(--ochre)}
.badge .bt{font-family:var(--fd);font-size:13px;font-weight:600}
.badge .bs{font-size:11px;color:var(--muted);line-height:1.6}

.pb-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px;font-family:var(--fd)}
.field label .en{margin-inline-start:5px}
.field input,.field select,.field textarea{
  width:100%;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:9px 12px;
  font-family:var(--fb);font-size:13.5px;color:var(--ink);resize:vertical;transition:border-color .15s,box-shadow .15s;
}
.field textarea{min-height:74px;line-height:1.7}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--indigo-b);box-shadow:0 0 0 3px var(--indigo-s)}
.chip-row{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;color:var(--ink2);transition:.15s}
.chip:hover{border-color:var(--indigo-b)}
.chip.on{background:var(--indigo);border-color:var(--indigo);color:#fff}

/* compare picker */
.cmp-pick{display:flex;flex-wrap:wrap;gap:8px}
.cmp-pick .chip.on{background:var(--ochre);border-color:var(--ochre)}
.cmp-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cmp-col h4{font-size:15px;padding-bottom:9px;border-bottom:2px solid var(--ochre)}
.cmp-row{padding:11px 0;border-bottom:1px solid var(--line2)}
.cmp-row .k{font-family:var(--fm);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:3px}

/* path */
.path-step{display:flex;gap:14px;align-items:flex-start}
.path-rail{display:flex;flex-direction:column;align-items:center;flex:none;align-self:stretch}
.path-rail .pd{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;font-family:var(--fm);font-size:11px;color:var(--muted);flex:none}
.path-rail .pd.done{background:var(--teal);border-color:var(--teal);color:#fff}
.path-rail .pl{width:1.5px;flex:1;background:var(--line);min-height:14px}
.path-body{padding-bottom:16px;flex:1;min-width:0}

/* mastery ladder */
.ladder{display:grid;gap:10px}
.rung{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:right;width:100%;transition:.18s;position:relative;overflow:hidden}
.rung:hover{border-color:var(--indigo-b);box-shadow:var(--sh-1)}
.rung .rn{font-family:var(--fm);font-size:11px;color:var(--faint);width:26px;flex:none}
.rung .rmeter{position:absolute;inset-block:0;inset-inline-start:0;background:var(--indigo-s);z-index:0;transition:width .6s}
.rung>*{position:relative;z-index:1}
.rung.reached{border-color:var(--teal-b)}
.rung.reached .rmeter{background:var(--teal-s)}

/* toast */
.toast{position:fixed;bottom:22px;inset-inline-start:22px;z-index:200;background:var(--ink);color:#fff;padding:11px 17px;border-radius:12px;font-size:13.5px;box-shadow:var(--sh-3);opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;font-family:var(--fd)}
.toast.show{opacity:1;transform:none}

/* modal */
.modal-bg{position:fixed;inset:0;z-index:150;background:rgba(21,22,28,.42);backdrop-filter:blur(3px);display:grid;place-items:center;padding:20px;opacity:0;animation:fade .2s forwards}
@keyframes fade{to{opacity:1}}
.modal{background:var(--surface);border-radius:var(--r-xl);max-width:620px;width:100%;max-height:86vh;overflow-y:auto;box-shadow:var(--sh-3);padding:24px}

@media (max-width:1040px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pb-grid{grid-template-columns:1fr}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;z-index:100;inset-block:0;inset-inline-start:0;width:280px;transform:translateX(100%);transition:transform .26s ease;box-shadow:var(--sh-3)}
  .side.open{transform:none}
  .mainwrap{grid-column:1}
  .burger{display:grid}
  .view{padding:22px 16px 80px}
  .g2,.g3,.g4,.cmp-cols{grid-template-columns:1fr}
  .search-wrap{width:auto;flex:1}
  .h-page{font-size:24px}
  .scrim{position:fixed;inset:0;background:rgba(21,22,28,.35);z-index:99}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

 dia:{t:"رحلة الطلب داخل كلود",steps:[
  {t:"المستخدم",en:"User",d:"أنت. تحدد الهدف والنتيجة اللي تبيها. كل ما كان الهدف واضح في راسك، كان الأمر أوضح على الورق."},
  {t:"التعليمات",en:"Instruction",d:"وش تبي بالضبط؟ الفعل (اكتب/حلّل/صحّح) + الشكل النهائي + القيود. هذي أهم خطوة وأكثر وحدة يتسرّع فيها الناس."},
  {t:"السياق",en:"Context",d:"المعلومات اللي يحتاجها: ملفات، بيانات، أمثلة، خلفية عن المشروع. بدون سياق، كلود يخمّن — وتخمينه ما يعرف تفاصيل شغلك."},
  {t:"كلود",en:"Claude",d:"النموذج يقرأ التعليمات + السياق كوحدة واحدة داخل نافذة السياق ويحدد المطلوب."},
  {t:"الاستدلال",en:"Reasoning",d:"يفكّك المهمة ويرتب الخطوات قبل ما يجاوب. في المهام المعقّدة اطلب منه يوضّح خطته أول، بعدين ينفّذ."},
  {t:"المخرجات",en:"Output",d:"النص أو الكود أو الجدول. حدد الصيغة مسبقاً (JSON، جدول، نقاط) عشان تستقبلها جاهزة."},
  {t:"الأدوات والتنفيذ",en:"Tools / Actions",d:"هنا يتحول من «يتكلم» إلى «يسوي»: يقرأ ملف، يشغّل أمر، ينادي API، يعدّل كود. هذي بداية طريق الوكلاء."}]},
 quiz:[
  {q:"وش أكثر شي يفرق في جودة رد كلود؟",o:["حجم النموذج فقط","وضوح التعليمات + جودة السياق","طول الرسالة","استخدام كلمات صعبة"],a:1,why:"النموذج نفسه ثابت في المحادثة الوحدة. اللي تتحكم فيه أنت هو <b>التعليمات والسياق</b> — وهو اللي يصنع الفرق الأكبر."},
  {q:"متى الأفضل ما تعتمد على كلود مباشرة؟",o:["تلخيص تقرير","حساب مالي دقيق بدون أداة","صياغة إيميل","شرح كود"],a:1,why:"الحسابات الدقيقة تحتاج أداة (كود أو حاسبة). اطلب منه يكتب لك السكربت اللي يحسب، بدل ما يحسب في راسه."}],
 ch:{o:"خذ مهمة تسوّيها يدوياً كل أسبوع وحوّلها لأمر واحد واضح.",r:["اكتب المهمة بجملة وحدة","حدد المدخلات والمخرجات","جرّب الأمر ٣ مرات وعدّله بعد كل مرة"],h:"ابدأ بجملة: «أنت [دور]. المطلوب [مهمة]. المدخلات [كذا]. أخرج النتيجة على شكل [كذا].»",sk:["صياغة التعليمات","تحديد المخرجات"]}});

T("context",{n:11,t:"إدارة السياق",en:"Context Management",c:"A",lv:2,ic:"window",
 s:"السياق هو «ذاكرة الجلسة»: كل اللي كتبته أنت + كل اللي رده كلود + الملفات المرفقة. له حجم محدود اسمه نافذة السياق (Context Window). لما تمتلئ بأشياء ما لها علاقة، تنزل دقة الردود.",
 p:"نافذة السياق تُقاس بالتوكنات وتشمل تعليمات النظام، المحادثة، والأدوات ومخرجاتها. إدارة السياق = اختيار ما يدخل النافذة ومتى يُلخّص أو يُسقط. القاعدة العملية: أعلى كثافة معلومات مفيدة لكل توكن. حجم النافذة يتغيّر حسب إصدار النموذج والخطة الحالية.",
 re:"مهندس يشتغل على مشروع فيه ٩٠٠ ملف. بدل ما يرمي المشروع كامل، يعطي كلود: شجرة المجلدات + الملفين المعنيين + ملف الإعدادات. النتيجة أدق وأسرع من رمي كل شي.",
 tr:"في محادثة طويلة اكتب: «لخّص كل اللي اتفقنا عليه في ١٠ نقاط مع القرارات النهائية.» انسخ التلخيص، افتح محادثة جديدة، والصقه كنقطة بداية. هذي أبسط تقنية «ضغط سياق».",
 biz:["إعداد ملف واحد فيه لهجة العلامة وجمهورها وممنوعاتها، ترفعه بأي مهمة تسويق","تجهيز «كتيب سياق» للعميل يُستخدم في كل المشاريع"],
 dev:["إعطاء التعريفات (types) والواجهات بدل الملفات الكاملة","تلخيص القرارات المعمارية في ملف واحد يُقرأ في بداية كل جلسة"],
 mis:["رمي المشروع كامل بأمل «يفهم لحاله»","إكمال محادثة عمرها ٣ ساعات بمواضيع مختلطة","نسيان إن مخرجات الأدوات تاكل من نفس النافذة"],
 use:["المهام الطويلة والمشاريع المستمرة","أي شغل على قاعدة كود أو مستندات كبيرة"],
 no:["سؤال بسيط سريع — لا تعقّدها","إذا كانت المعلومة تتغير كل يوم، اربطها بأداة بدل ما تلصقها"],
 rel:["memory","projects","code","adv-eng"],
 dia:{t:"دورة حياة السياق",steps:[
  {t:"اجمع",en:"Collect",d:"حدد المعلومات الضرورية فقط: ملفات، أمثلة، قيود، قرارات سابقة."},
  {t:"رتّب",en:"Structure",d:"عناوين وأقسام واضحة. المعلومة المرتبة تُستخدم أفضل من كتلة نص طويلة."},
  {t:"حمّل",en:"Load",d:"ادخلها في بداية الجلسة أو في ملف مشروع دائم بدل التكرار كل مرة."},
  {t:"راقب",en:"Monitor",d:"لاحظ متى بدأت الردود تتوه أو تكرّر — هذي علامة امتلاء أو تلوّث السياق."},
  {t:"لخّص",en:"Compress",d:"اطلب تلخيص القرارات والحالة الحالية، واستخدمه كنقطة انطلاق."},
  {t:"ابدأ نظيف",en:"Reset",d:"جلسة جديدة بسياق مضغوط أفضل من جلسة متعبة بسياق متضخم."}]},
 quiz:[
  {q:"وش اللي ما يستهلك من نافذة السياق؟",o:["رسائلك","ردود كلود","مخرجات الأدوات","إعدادات متصفحك"],a:3,why:"كل شي داخل المحادثة يستهلك توكنات — بما فيها مخرجات الأدوات. إعدادات المتصفح خارج اللعبة تماماً."},
  {q:"محادثة طويلة صارت ردودها ضعيفة. أفضل تصرف؟",o:["تكرر الطلب بصوت أعلى","تلخّص القرارات وتبدأ جلسة جديدة","تكتب بالإنجليزي","تطلب رد أطول"],a:1,why:"<b>ضغط السياق ثم إعادة البدء</b> يرجّع التركيز. التكرار داخل نفس الجلسة يزيد الازدحام."}],
 ch:{o:"اصنع ملف سياق لمشروعك الحالي في أقل من صفحة.",r:["الهدف من المشروع","أهم ٥ قرارات متخذة","القيود والممنوعات","نبرة/أسلوب المخرجات"],h:"لو ما قدرت تختصره في صفحة، يعني مشروعك يحتاج توضيح قبل كلود.",sk:["ضغط السياق","توثيق القرارات"]}});

T("memory",{n:12,t:"الذاكرة ومعرفة المشروع",en:"Memory & Project Knowledge",c:"A",lv:2,ic:"brain",
 s:"كلود ما يتذكر محادثاتك القديمة تلقائياً في كل مكان. عشان «يتذكر»، تعطيه معرفة دائمة: مستندات داخل مشروع، أو ملف تعليمات ثابت. الفرق بين ذاكرة وسياق: السياق مؤقت للجلسة، والمعرفة تتحمّل معك كل جلسة.",
 p:"عملياً عندك ثلاث طبقات: (١) ذاكرة الجلسة = نافذة السياق، (٢) معرفة دائمة = ملفات المشروع أو CLAUDE.md تُحقن في كل جلسة، (٣) استرجاع خارجي = RAG أو أدوات تجيب المعلومة عند الحاجة. اختيار الطبقة يعتمد على حجم المعرفة ومعدل تغيّرها.",
 re:"وكالة تسويق حاطة في مشروع كلود: دليل الهوية، أمثلة إعلانات ناجحة، وقائمة كلمات ممنوعة. أي موظف يفتح المشروع يطلع بنفس النبرة — بدون ما يشرح من الصفر.",
 tr:"سوّ مشروع جديد في كلود، ارفع فيه ٣ ملفات تخص شغلك، واكتب في تعليمات المشروع: «التزم دائماً بنبرة الملف المرفق ولا تخترع أرقام.» ثم اسأل سؤال بدون ما تعيد الشرح.",
 biz:["دليل هوية + سياسات + أسئلة شائعة كمعرفة ثابتة للدعم","أرشيف عروض سابقة يُبنى عليها العرض الجديد"],
 dev:["ملف معماري يشرح الطبقات والاصطلاحات","سجل قرارات تقنية (ADR) يمنع تكرار نفس النقاش"],
 mis:["رفع ٥٠ ملف بدون تنظيم — الضجيج يضر أكثر ما ينفع","وضع معلومات سريعة التغيّر في ملف ثابت وينسون تحديثه","خلط معرفة عميلين في مشروع واحد"],
 use:["معرفة ثابتة نسبياً وتتكرر كل جلسة","فرق تحتاج مخرجات موحّدة بين الأعضاء"],
 no:["بيانات لحظية (مخزون، أسعار) — استخدم أداة أو API","ملفات ضخمة جداً — لخّصها أو استخدم استرجاع"],
 rel:["projects","context","mcp","ecosystem"],
 dia:{t:"طبقات معرفة كلود",steps:[
  {t:"الجلسة",en:"Session",d:"مؤقت. ينتهي بانتهاء المحادثة. مناسب للتجارب والمهام السريعة."},
  {t:"تعليمات المشروع",en:"Project Instructions",d:"قواعد دائمة تُطبّق على كل محادثة داخل المشروع: النبرة، الممنوعات، شكل المخرجات."},
  {t:"ملفات المعرفة",en:"Knowledge Files",d:"مستندات مرفوعة يرجع لها كلود: أدلة، أمثلة، سياسات."},
  {t:"استرجاع خارجي",en:"Retrieval / RAG",d:"لما تكون المعرفة أكبر من أي نافذة: تُخزّن وتُسترجع القطع المناسبة عند السؤال."},
  {t:"أدوات حيّة",en:"Live Tools",d:"للبيانات المتغيّرة: قاعدة بيانات، API، ملف Sheets. المعلومة تُجلب وقت الحاجة."}]},
 quiz:[
  {q:"وين تحط «سعر المنتج الحالي» اللي يتغير كل أسبوع؟",o:["ملف معرفة ثابت","أداة أو API حيّ","تعليمات المشروع","رسالة أول المحادثة"],a:1,why:"المعلومة المتغيّرة تُجلب <b>وقت الطلب</b> عبر أداة، وإلا صرت تعتمد على رقم قديم."},
  {q:"تعليمات المشروع الأنسب لها:",o:["قواعد ثابتة تتكرر كل جلسة","تفاصيل مهمة اليوم","نتيجة آخر تقرير","أسئلة عابرة"],a:0,why:"تعليمات المشروع للقواعد <b>الدائمة</b>. التفاصيل اليومية مكانها الرسالة نفسها."}],
 ch:{o:"جهّز مشروع كلود لعميل أو لمنتجك مع معرفة دائمة.",r:["٣ ملفات معرفة كحد أدنى","تعليمات مشروع لا تتجاوز ١٥ سطر","اختبر بسؤالين مختلفين وقارن الاتساق"],h:"اكتب التعليمات كقواعد قابلة للتحقق: «لا تخترع أرقام» أفضل من «كن دقيقاً».",sk:["تصميم المعرفة","توحيد المخرجات"]}});

T("models",{n:2,t:"استخدام كلود ونماذجه",en:"Using Claude & Models",c:"A",lv:1,ic:"layers",
 s:"كلود يجيك بأكثر من باب: محادثة على الويب والجوال، تطبيق سطح المكتب، سطر الأوامر (Claude Code)، وواجهة برمجية (API). ونماذجه تجي بأحجام مختلفة: نماذج سريعة ورخيصة للمهام البسيطة، ونماذج أقوى للتفكير العميق والكود.",
 p:"اختيار المنفذ = اختيار نمط الاستخدام: المحادثة للاستكشاف، Projects للسياق المتكرر، Claude Code للعمل على ملفات ومستودع، API للتضمين داخل منتج. اختيار النموذج مقايضة بين الجودة والسرعة والتكلفة. أسماء النماذج وحدود الاستخدام تتغيّر حسب إصدار النموذج والخطة الحالية — تحقق من الوثائق الرسمية قبل ما تبني عليها قرار.",
 re:"فريق منتج يستخدم نموذج سريع لتصنيف آلاف التذاكر يومياً (تكلفة منخفضة)، ونموذج أقوى لكتابة الرد على الحالات المعقّدة فقط. النتيجة: جودة عالية وتكلفة معقولة.",
 tr:"خذ نفس المهمة وجرّبها في مكانين: مرة في المحادثة، ومرة في Claude Code على مجلد فيه ملفات. لاحظ الفرق: الثاني يقدر يقرأ ويعدّل فعلياً.",
 biz:["نموذج سريع للفرز والتصنيف، ونموذج أقوى للقرارات","حساب التكلفة لكل مهمة قبل التوسّع"],
 dev:["نموذج خفيف للمهام الروتينية داخل CI","نموذج قوي للمهام المعمارية والمراجعات"],
 mis:["استخدام أقوى نموذج لكل شي وبعدين الشكوى من التكلفة","افتراض إن أسماء النماذج ثابتة للأبد","عدم تجربة نفس المهمة على أكثر من منفذ"],
 use:["قبل بناء أي نظام: حدد المنفذ والنموذج","لما تبي توازن جودة/تكلفة/سرعة"],
 no:["لا تبالغ بالتحسين قبل ما يشتغل الشي أصلاً","لا تبني منطقك على رقم غير موثّق"],
 rel:["basics","projects","api","adv-eng"],
 dia:{t:"اختيار المنفذ المناسب",steps:[
  {t:"محادثة",en:"Chat",d:"استكشاف، عصف ذهني، أسئلة، صياغة. الأسرع للبدء والأقل التزاماً."},
  {t:"مشروع",en:"Project",d:"نفس المحادثة لكن مع معرفة وتعليمات دائمة. مناسب للشغل المتكرر."},
  {t:"Artifacts",en:"Artifacts",d:"لما تبي مخرج قابل للاستخدام: صفحة، أداة، لوحة — لا مجرد نص."},
  {t:"Claude Code",en:"Claude Code",d:"لما يكون الشغل على ملفات ومستودع حقيقي: يقرأ، يعدّل، يشغّل، يلتزم بـ Git."},
  {t:"API",en:"API",d:"لما تبي كلود داخل منتجك أو أتمتتك، بحجم ومقياس وتحكم كامل."}]},
 quiz:[
  {q:"تبي كلود يعدّل ٧ ملفات في مستودعك ويشغّل الاختبارات. وين تروح؟",o:["المحادثة","Claude Code","Artifact","مشروع"],a:1,why:"<b>Claude Code</b> هو المنفذ الوحيد اللي يشتغل مباشرة على ملفاتك ويشغّل أوامر."},
  {q:"أي عبارة صحيحة عن اختيار النموذج؟",o:["الأقوى دائماً هو الصح","مقايضة بين جودة وسرعة وتكلفة","الفرق شكلي","النموذج الرخيص ما ينفع لشي"],a:1,why:"الاختيار <b>مقايضة</b>. كثير من المهام الروتينية تنحل بنموذج سريع بجودة كافية."}],
 ch:{o:"ارسم خريطة منافذ لشغلك: أي مهمة تروح لأي منفذ.",r:["اكتب ٦ مهام تسوّيها أسبوعياً","حدد لكل مهمة المنفذ الأنسب","برر الاختيار بسطر"],h:"لو المهمة تلمس ملفات → Code. لو تتكرر بنفس القواعد → Project. لو داخل منتج → API.",sk:["اختيار الأدوات","تقدير التكلفة"]}});

T("api",{n:16,t:"واجهات كلود البرمجية",en:"Claude API",c:"A",lv:2,ic:"api",
 s:"الـ API هو طريقك لاستخدام كلود داخل برنامجك أو موقعك أو أتمتتك: ترسل رسالة، وتستقبل رد — برمجياً وبدون ما أحد يفتح محادثة.",
 p:"طلب Messages يتكوّن من: model، system prompt، مصفوفة messages بأدوار user/assistant، معاملات مثل max_tokens وtemperature، واختيارياً tools. الردود تدعم البث (streaming) واستدعاء الأدوات. التسعير بالتوكنات (إدخال/إخراج)، والتخزين المؤقت للتعليمات المتكررة يخفض التكلفة. التفاصيل والأسعار تتغيّر حسب إصدار النموذج والخطة الحالية.",
 re:"متجر يربط نموذج تصنيف: كل رسالة عميل جديدة تروح للـ API مع تعليمات نظام ثابتة، والرد يرجع JSON فيه {نوع الطلب، الأولوية، رد مقترح}، ويُكتب مباشرة في نظام التذاكر.",
 tr:"جرّب في n8n أو أي أداة: عقدة HTTP ترسل رسالة واحدة لكلود، وتطلب منه يرجع JSON بمفاتيح محددة. ثم اربط المخرج بجدول Google Sheets.",
 biz:["تصنيف وتوجيه رسائل العملاء تلقائياً","توليد أوصاف منتجات بالجملة","استخراج بيانات من فواتير ومستندات"],
 dev:["تضمين مساعد داخل منتجك","خط معالجة دفعي للبيانات النصية","بناء وكلاء يستدعون أدواتك"],
 mis:["نسيان تثبيت صيغة المخرجات فتنكسر الأتمتة","وضع المفتاح السري داخل كود الواجهة الأمامية","عدم التعامل مع الأخطاء وحدود المعدل (rate limits)"],
 use:["حجم كبير أو تكرار عالي","تحتاج تحكم كامل في المدخلات والمخرجات"],
 no:["مهمة تسوّيها مرة بالشهر — المحادثة أسرع","تجربة استكشافية ما تحتاج كود"],
 rel:["fn-calling","automation","adv-eng","security"],
 dia:{t:"شكل طلب الـ API",steps:[
  {t:"تعليمات النظام",en:"System",d:"من هو كلود في هذي المهمة وقواعده الثابتة. يُرسل مرة مع كل طلب ويستفيد من التخزين المؤقت."},
  {t:"الرسائل",en:"Messages",d:"سجل الحوار بأدوار user/assistant. أنت اللي تبني هذا السجل وتقرر وش يبقى منه."},
  {t:"المعاملات",en:"Params",d:"model، max_tokens، temperature، stop. تتحكم بالطول والعشوائية."},

T("workflows",{n:8,t:"سير عمل Claude Code",en:"Claude Code Workflows",c:"C",lv:2,ic:"flow",

 biz:["عملية تسليم واضحة يفهمها غير التقنيين","تقدير أدق للوقت لأن الخطوات معروفة"],

T("mcp",{n:13,t:"بروتوكول MCP",en:"Model Context Protocol",c:"D",lv:3,ic:"plug",
 s:"MCP هو «مقبس موحّد» يربط كلود بالأدوات والبيانات الخارجية: قاعدة بيانات، ملفات، GitHub، أو أي خدمة. بدل ما تبني ربط خاص لكل أداة، تبني خادم MCP مرة ويشتغل مع أي عميل يدعم البروتوكول.",
 p:"MCP بروتوكول مفتوح يوحّد كيف تعرض التطبيقات ثلاثة أنواع: Tools (أفعال قابلة للاستدعاء)، Resources (بيانات قابلة للقراءة)، Prompts (قوالب جاهزة). المعمارية: مضيف/عميل داخل تطبيق كلود ← خادم MCP ← الخدمة الفعلية. الفائدة الأكبر: قابلية إعادة الاستخدام وفصل الصلاحيات في مكان واحد.",
 re:"فريق بنى خادم MCP لقاعدة بيانات الطلبات مع أدوات قراءة فقط. صار أي شخص يسأل «كم طلب متأخر هذا الأسبوع؟» ويجي الجواب من البيانات الحقيقية — بدون وصول مباشر للقاعدة.",
 tr:"اربط خادم MCP جاهز (مثل خادم ملفات أو GitHub) بعميل يدعمه، واطلب مهمة تحتاج بياناته. لاحظ الفرق بين إجابة من ذاكرة النموذج وإجابة من مصدر حقيقي.",
 biz:["ربط كلود بأنظمة الشركة بدون كشف كل شي","توحيد الوصول للبيانات عبر واجهة واحدة"],

T("tools",{n:14,t:"الأدوات والتكاملات",en:"Tools & Integrations",c:"D",lv:2,ic:"wrench",
 s:"الأداة هي أي شي يقدر كلود يستخدمه خارج نصه: بحث، قراءة ملف، إرسال إيميل، استعلام قاعدة بيانات. بالأدوات يتحول من «يعرف» إلى «يسوي».",
 p:"تعريف الأداة = اسم + وصف + مخطط مدخلات. جودة الوصف تحدد دقة الاختيار أكثر من أي شي ثاني. صمّم أدوات بحبيبات صحيحة: لا أداة عملاقة تسوي كل شي، ولا عشرين أداة متشابهة. أرجع مخرجات مختصرة ومنظّمة، وتعامل مع الأخطاء برسائل يقدر النموذج يتصرف بناءً عليها.",

 tr:"اكتب تعريف أداة على الورق: الاسم، وصف بجملتين يحدد متى تُستخدم ومتى لا، والمدخلات بأنواعها. ثم اسأل: هل يقدر شخص غريب يعرف متى يستخدمها؟",
 biz:["ربط كلود بأنظمة CRM والمخزون","أتمتة إرسال التقارير والتنبيهات"],

T("fn-calling",{n:15,t:"استدعاء الدوال",en:"Function Calling",c:"D",lv:3,ic:"fn",
 s:"استدعاء الدوال هو الآلية اللي تخلي كلود يقول: «أبي أشغّل هذي الدالة بهذي المدخلات». برنامجك ينفّذها ويرجّع له النتيجة، وهو يكمل. النموذج ما ينفّذ بنفسه — أنت المنفّذ.",
 p:"الدورة: تعطي تعريفات الأدوات ← النموذج يرجع طلب استدعاء بمدخلات مطابقة للمخطط ← تنفّذ وترجّع النتيجة كرسالة أداة ← يكمل أو يستدعي مرة ثانية. مسؤولياتك: التحقق من المدخلات، الصلاحيات، المهل، وإعادة المحاولة. هذي هي القاعدة اللي يقوم عليها كل شي وكيلي.",
 re:"مساعد حجز: يستدعي get_availability بتاريخ ومدة، يستقبل المواعيد المتاحة، يعرضها على المستخدم، وبعد التأكيد يستدعي create_booking.",
 tr:"عرّف أداتين وهميتين على الورق ومثّل الدورة كاملة: طلب الاستدعاء، النتيجة المرجعة، الرد النهائي. رسم الدورة يوضّح الفكرة أكثر من الشرح.",
 biz:["ربط المساعد بالحجوزات والمخزون والفواتير","تنفيذ إجراءات فعلية من محادثة العميل"],

<script>
/* ================= التطبيق ================= */
const TMAP = {}; TOPICS.forEach(t=>TMAP[t.id]=t);
const CL_ORDER = ["A","B","C","D","E","F"];
const CL_VAR = {A:"indigo",B:"ochre",C:"sky",D:"teal",E:"plum",F:"rose"};

const store = {
  key:"claude-map-v1",
  read(){ try{ const r=localStorage.getItem(this.key); return r?JSON.parse(r):null }catch(e){ return null } },
  write(v){ try{ localStorage.setItem(this.key,JSON.stringify(v)) }catch(e){} }
};
let ST = Object.assign({done:{},quiz:{},chal:{},path:"beg"}, store.read()||{});
function save(){ store.write(ST) }
const isDone = id => !!ST.done[id];
const doneCount = () => Object.keys(ST.done).length;
const quizCount = () => Object.keys(ST.quiz).length;

function pct(a,b){ return b?Math.round(a/b*100):0 }
function clusterProg(c){ const l=TOPICS.filter(t=>t.c===c); return {done:l.filter(t=>isDone(t.id)).length,total:l.length} }
function ar(n){ return String(n) }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") }
function plate(n){ return String(n).padStart(2,"0") }

/* ---------- عناصر مشتركة ---------- */
function levelTag(lv){ return `<span class="tag lv${lv}">${LV[lv]}</span>` }
function topicTile(t){
  return `<button class="tile c${t.c}" data-go="#/t/${t.id}">
    <div class="tile-top"><span class="ic-box">${svg(t.ic)}</span>
      <div style="min-width:0"><div style="font-family:var(--fd);font-weight:600;font-size:14px">${t.t}</div>
      <div class="en">${t.en}</div></div>
      <span class="plate">${plate(t.n)}</span></div>
    <div class="small muted" style="line-height:1.65">${t.s.slice(0,90)}…</div>
    <div class="row" style="gap:6px;margin-top:2px">${levelTag(t.lv)}${isDone(t.id)?'<span class="tag done">مكتمل</span>':''}</div>
  </button>`;
}
function chainHTML(steps,key,note){
  const s = steps.map((x,i)=>`<button class="step${i===0?' on':''}" data-chain="${key}" data-i="${i}">
      <span class="i">${plate(i+1)}</span><span>${x.t}</span><span class="en">${x.en}</span></button>`)
    .join('<span class="arw">←</span>');
  return `<div class="chain" id="ch-${key}">${s}</div>
    <div class="chain-note" id="note-${key}"><b>${steps[0].t} — ${steps[0].en}</b><br>${steps[0].d}</div>`;
}
function loopHTML(steps,key){
  const n=steps.length, R=38;
  const nodes = steps.map((x,i)=>{
    const a = (-90 + i*360/n) * Math.PI/180;
    const x1 = 50 + R*Math.cos(a), y1 = 50 + R*Math.sin(a);
    return `<button class="lnode${i===0?' on':''}" data-chain="${key}" data-i="${i}" style="left:${x1}%;top:${y1}%">${x.t}<small>${x.en}</small></button>`;
  }).join('');
  let path='';
  for(let i=0;i<n;i++){
    const a1=(-90+i*360/n)*Math.PI/180, a2=(-90+(i+1)*360/n)*Math.PI/180;
    path+=`<path d="M ${50+30*Math.cos(a1)} ${50+30*Math.sin(a1)} A 30 30 0 0 1 ${50+30*Math.cos(a2)} ${50+30*Math.sin(a2)}" fill="none" stroke="var(--line)" stroke-width="0.7"/>`;
  }
  return `<div class="loopwrap"><svg class="ring-svg" viewBox="0 0 100 100">${path}</svg>
    <div class="loop-center" id="note-${key}"><b style="font-family:var(--fd)">${steps[0].t}</b><br>${steps[0].d}</div>${nodes}</div>`;
}
function diagram(d,key){
  return d.loop ? loopHTML(d.steps,key) : chainHTML(d.steps,key);
}
function quizHTML(qs,key){
  return qs.map((q,qi)=>`<div class="quiz-q" data-quiz="${key}" data-qi="${qi}">
    <div class="qt"><span class="qn">س${qi+1}</span><span>${q.q}</span></div>
    <div class="opts">${q.o.map((o,oi)=>`<button class="opt" data-oi="${oi}"><span class="mk">${["أ","ب","ج","د"][oi]}</span><span>${o}</span></button>`).join('')}</div>
    <div class="why" hidden></div></div>`).join('<div style="height:10px"></div>');
}
function blk(kicker,title,body,icon){
  return `<section class="block"><div class="block-h">${icon?`<span style="color:var(--muted)">${svg(icon)}</span>`:''}
    <div><div class="k">${kicker}</div><h3>${title}</h3></div></div><div class="block-b">${body}</div></section>`;
}
function bars(items){
  return `<div class="stack gap-14">`+items.map(i=>`<div class="pline">
    <span class="pl-t">${i.t}</span>
    <span class="bar-track" style="flex:1"><span class="bar-fill ${i.c||''}" style="width:${i.p}%"></span></span>
    <span class="pl-v">${i.d}/${i.n}</span></div>`).join('')+`</div>`;
}

/* ---------- الخريطة ---------- */
const STAGE_W=1820, STAGE_H=1820, CX=910, CY=910;
const HUB_R=300, RING_R=[560,690,820];
let mapT={x:0,y:0,k:.8}, hiddenCl={};

function mapLayout(){
  const nodes=[], links=[];
  nodes.push({id:"__core",kind:"core",x:CX,y:CY});
  CL_ORDER.forEach((c,ci)=>{
    const ang = (-90 + ci*60) * Math.PI/180;
    const hx = CX + HUB_R*Math.cos(ang), hy = CY + HUB_R*Math.sin(ang);
    nodes.push({id:"__h"+c,kind:"hub",c:c,x:hx,y:hy});
    links.push({a:[CX,CY],b:[hx,hy],c:c});
    const list = TOPICS.filter(t=>t.c===c);
    list.forEach((t,i)=>{
      const ring = Math.floor(i/3), k = list.slice(ring*3,ring*3+3).length, j = i%3;
      const r = RING_R[ring];
      const nodeDeg = 176*180/(Math.PI*r);
      const step = Math.min(196*180/(Math.PI*r), (58-nodeDeg)/2);
      const a = (-90 + ci*60 + (j-(k-1)/2)*step) * Math.PI/180;
      const x = CX + r*Math.cos(a), y = CY + r*Math.sin(a);
      nodes.push({id:t.id,kind:"topic",c:c,x,y,t});
      links.push({a:[hx,hy],b:[x,y],c:c});
    });
  });
  return {nodes,links};
}
function viewMap(){
  const {nodes,links}=mapLayout();
  const paths = links.map((l,i)=>{
    const mx=(l.a[0]+l.b[0])/2, my=(l.a[1]+l.b[1])/2;
    return `<path d="M ${l.a[0]} ${l.a[1]} Q ${mx} ${my} ${l.b[0]} ${l.b[1]}" data-cl="${l.c}"/>`;
  }).join('');
  const els = nodes.map(n=>{
    if(n.kind==="core") return `<div class="node" style="left:${n.x}px;top:${n.y}px"><div class="n-core">
      <div class="k">Anthropic</div><div class="t">كلود</div><div class="s">الذكاء الاصطناعي من Anthropic — ٣٥ فرعاً من الصفر للاحتراف</div></div></div>`;
    if(n.kind==="hub") return `<div class="node" data-cl="${n.c}" style="left:${n.x}px;top:${n.y}px"><div class="n-hub">
      <div class="t">${CLUSTERS[n.c].t}</div><div class="s">${CLUSTERS[n.c].en}</div></div></div>`;
    const t=n.t;
    return `<div class="node" data-cl="${n.c}" style="left:${n.x}px;top:${n.y}px">
      <button class="n-topic${isDone(t.id)?' done':''}" data-go="#/t/${t.id}" data-node="${t.id}">
        <span class="sq" style="background:var(--${CL_VAR[n.c]})"></span>
        <span style="min-width:0"><span class="tt">${t.t}</span><span class="te">${t.en}</span></span>
        <span class="chk">${svg('check')}</span></button></div>`;
  }).join('');
  const legend = CL_ORDER.map(c=>{const p=clusterProg(c);return `<button data-cl-toggle="${c}" class="${hiddenCl[c]?'off':''}">
      <span class="dot" style="background:var(--${CL_VAR[c]})"></span><span style="flex:1">${CLUSTERS[c].t}</span>
      <span class="num" style="font-size:10.5px;color:var(--faint)">${p.done}/${p.total}</span></button>`}).join('');
  return `<div class="mapview" id="mapview">
    <div class="stage" id="stage" style="width:${STAGE_W}px;height:${STAGE_H}px">
      <svg class="links" viewBox="0 0 ${STAGE_W} ${STAGE_H}" width="${STAGE_W}" height="${STAGE_H}">${paths}</svg>${els}</div>
    <div class="map-ui tl">
      <div class="legend"><div class="lh">الفروع الستة</div>${legend}</div>
    </div>
    <div class="map-ui br">
      <div class="zoom">
        <button data-zoom="1" aria-label="تكبير">${svg('plus')}</button>
        <button data-zoom="-1" aria-label="تصغير">${svg('minus')}</button>
        <button data-zoom="0" aria-label="ملاءمة">${svg('fit')}</button>
      </div>
    </div>
    <div class="map-ui bl"><div class="map-hint">اسحب للتحريك · عجلة الفأرة للتكبير · اضغط أي فرع لفتحه</div></div>
  </div>`;
}
function applyMapT(anim){
  const s=document.getElementById('stage'); if(!s) return;
  s.style.transition = anim ? 'transform .45s cubic-bezier(.2,.8,.2,1)' : 'none';
  s.style.transform = `translate(${mapT.x}px,${mapT.y}px) scale(${mapT.k})`;
}
function fitMap(anim){
  const v=document.getElementById('mapview'); if(!v) return;
  const w=v.clientWidth,h=v.clientHeight;
  mapT.k = Math.min(w/STAGE_W,h/STAGE_H)*0.97;
  mapT.x = (w-STAGE_W*mapT.k)/2; mapT.y=(h-STAGE_H*mapT.k)/2;
  applyMapT(anim);
}
function centerOn(x,y,k){
  const v=document.getElementById('mapview'); if(!v) return;
  mapT.k = k||mapT.k;
  mapT.x = v.clientWidth/2 - x*mapT.k; mapT.y = v.clientHeight/2 - y*mapT.k;
  applyMapT(true);
}
function initMap(){
  const v=document.getElementById('mapview'); if(!v) return;
  const small = v.clientWidth < 700;
  mapT.k = small ? 0.6 : 0.72;
  centerOn(CX,CY-40,mapT.k);
  let dragging=false,sx=0,sy=0,ox=0,oy=0,moved=false;
  v.addEventListener('pointerdown',e=>{ if(e.target.closest('.map-ui')||e.target.closest('.n-topic'))return;
    dragging=true;moved=false;sx=e.clientX;sy=e.clientY;ox=mapT.x;oy=mapT.y;v.classList.add('drag');v.setPointerCapture(e.pointerId)});
  v.addEventListener('pointermove',e=>{ if(!dragging)return; moved=true;
    mapT.x=ox+(e.clientX-sx); mapT.y=oy+(e.clientY-sy); applyMapT(false)});
  v.addEventListener('pointerup',e=>{dragging=false;v.classList.remove('drag')});
  v.addEventListener('pointercancel',()=>{dragging=false;v.classList.remove('drag')});
  v.addEventListener('wheel',e=>{ e.preventDefault();
    const r=v.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
    const nk=Math.min(1.6,Math.max(0.3,mapT.k*(e.deltaY<0?1.12:0.89)));
    mapT.x = mx-(mx-mapT.x)*(nk/mapT.k); mapT.y = my-(my-mapT.y)*(nk/mapT.k); mapT.k=nk; applyMapT(false);
  },{passive:false});
  v.querySelectorAll('.n-topic').forEach(n=>{
    n.addEventListener('mouseenter',()=>highlight(n.dataset.node,true));
    n.addEventListener('mouseleave',()=>highlight(n.dataset.node,false));
  });
  applyClusterFilter();
}
function highlight(id,on){
  const t=TMAP[id]; if(!t) return;
  document.querySelectorAll('#stage .node').forEach(n=>{
    const nid=n.querySelector('.n-topic')?.dataset.node;
    if(!on){ n.classList.remove('dim'); return }
    const keep = nid===id || n.querySelector('.n-core') || n.dataset.cl===t.c;
    n.classList.toggle('dim',!keep);
  });
  document.querySelectorAll('#stage .links path').forEach(p=>{
    if(!on){p.classList.remove('dim','hl');return}
    const same=p.dataset.cl===t.c; p.classList.toggle('hl',same); p.classList.toggle('dim',!same);
  });
}
function applyClusterFilter(){
  document.querySelectorAll('#stage .node[data-cl]').forEach(n=>{ n.style.display = hiddenCl[n.dataset.cl] ? 'none':'' });
  document.querySelectorAll('#stage .links path').forEach(p=>{ p.style.display = hiddenCl[p.dataset.cl] ? 'none':'' });
  document.querySelectorAll('[data-cl-toggle]').forEach(b=>b.classList.toggle('off',!!hiddenCl[b.dataset.clToggle]));
}
</script>
<script>

  </div>

  <div class="grid g2">

  </div>

  <div class="grid g3">
    ${blk('٧','أخطاء شائعة',`<ul class="lst warn">${t.mis.map(x=>`<li>${x}</li>`).join('')}</ul>`,'bug')}

  "#/prompt":["الأكاديميات","هندسة الأوامر"],"#/claude-code":["الأكاديميات","إتقان Claude Code"],"#/agents":["الأكاديميات","كلود الوكيل"],
  "#/mcp":["الأكاديميات","أكاديمية MCP"],"#/automation":["الأكاديميات","الأتمتة"],"#/integrations":["الأكاديميات","التكاملات"],
  "#/projects":["طبّق","معرض المشاريع"],"#/challenges":["طبّق","التحديات"],"#/concepts":["قارن","مقارنة المفاهيم"],
  "#/compare":["قارن","مقارنة النماذج"],"#/mastery":["خريطة الإتقان"]};
function renderCrumb(h){
  let parts=CRUMBS[h];
  if(!parts){
    if(h.startsWith("#/t/")){ const t=TMAP[h.slice(4)]; parts = t?["الخريطة",CLUSTERS[t.c].t,t.t]:["غير موجود"] }
    else if(h.startsWith("#/search")) parts=["بحث"];
    else parts=["الخريطة"];
  }
  document.getElementById('crumb').innerHTML = parts.map((p,i)=>
    i===parts.length-1?`<b>${p}</b>`:`${p}<span>/</span>`).join(' ');
}
function router(){
  const h=location.hash||"#/map", main=document.getElementById('main');
  let html;
  if(h.startsWith("#/t/")) html=viewTopic(h.slice(4));
  else if(h.startsWith("#/search/")) html=viewSearch(decodeURIComponent(h.slice(9)));
  else switch(h){
    case "#/dashboard": html=viewDash(); break;
    case "#/paths": html=viewPaths(); break;
    case "#/basics": html=viewBasics(); break;
    case "#/prompt": html=viewPrompt(); break;
    case "#/claude-code": html=viewCodeAcademy(); break;
    case "#/agents": html=viewAgents(); break;
    case "#/mcp": html=viewMCP(); break;
    case "#/automation": html=viewAuto(); break;
    case "#/integrations": html=viewIntegrations(); break;
    case "#/projects": html=viewProjects(); break;
    case "#/challenges": html=viewChallenges(); break;
    case "#/concepts": html=viewConcepts(); break;
    case "#/compare": html=viewCompare(); break;
    case "#/mastery": html=viewMastery(); break;
    default: html=viewMap();
  }
  main.innerHTML=html;
  main.scrollIntoView?window.scrollTo(0,0):0;
  if(h==="#/map"||h===""||h==="#") initMap();
  renderNav(); renderRing(); renderCrumb(h);
  document.getElementById('side').classList.remove('open');
  document.querySelector('.scrim')?.remove();
}

/* ---------- التفاعلات ---------- */
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2000);
}
const app = {
  toggleSide(){
    const s=document.getElementById('side'); s.classList.toggle('open');
    if(s.classList.contains('open')){ const d=document.createElement('div'); d.className='scrim';
      d.onclick=()=>{s.classList.remove('open');d.remove()}; document.body.appendChild(d) }
    else document.querySelector('.scrim')?.remove();
  },
  resetAll(){ if(!confirm("تصفير كل التقدّم؟ ما ينعاد.")) return;
    ST={done:{},quiz:{},chal:{},path:"beg"}; save(); router(); toast("تم تصفير التقدّم") }
};

document.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]');
  if(go){ location.hash=go.dataset.go; return }

  const done=e.target.closest('[data-done]');
  if(done){ const id=done.dataset.done;
    if(ST.done[id]) delete ST.done[id]; else ST.done[id]=Date.now();
    save(); router(); toast(ST.done[id]?"تم تعليم الموضوع مكتملاً":"أُلغي التعليم"); return }

  const chal=e.target.closest('[data-chal]');
  if(chal){ const n=chal.dataset.chal;
    if(ST.chal[n]) delete ST.chal[n]; else ST.chal[n]=Date.now(); save(); router(); return }

  const pathB=e.target.closest('[data-path]');
  if(pathB){ ST.path=pathB.dataset.path; save(); router(); toast("تم تغيير مسارك"); return }

  const ch=e.target.closest('[data-chain]');
  if(ch){ const key=ch.dataset.chain, i=+ch.dataset.i;
    document.querySelectorAll(`[data-chain="${key}"]`).forEach(b=>b.classList.remove('on'));
    ch.classList.add('on');
    let steps=null;
    if(key.startsWith('t-')) steps=TMAP[key.slice(2)].dia.steps;
    else if(key==='fund') steps=TMAP.basics.dia.steps;
    else if(key==='agentloop') steps=TMAP.agents.dia.steps;
    else if(key==='mcparch') steps=TMAP.mcp.dia.steps;
    else if(key==='autoladder') steps=TMAP.automation.dia.steps;
    else if(key==='wfdesign') steps=TMAP['ai-workflows'].dia.steps;
    if(steps) document.getElementById('note-'+key).innerHTML=`<b>${steps[i].t} — ${steps[i].en}</b><br>${steps[i].d}`;
    return }

  const wf=e.target.closest('[data-wf]');
  if(wf){ wfSel=+wf.dataset.wf;
    document.querySelectorAll('[data-wf]').forEach(b=>b.classList.remove('on')); wf.classList.add('on');
    document.getElementById('wf-body').innerHTML=wfDetail(wfSel); return }

  const ct=e.target.closest('[data-codetab]');
  if(ct){ codeTab=ct.dataset.codetab;
    document.querySelectorAll('[data-codetab]').forEach(b=>b.classList.remove('on')); ct.classList.add('on');
    document.getElementById('code-body').innerHTML=CODE_LEVELS[codeTab].items.map((it,i)=>
      `<div class="card flat pad-s"><div class="row" style="gap:8px">
        <span class="num" style="font-size:11px;color:var(--faint)">${plate(i+1)}</span>
        <b style="font-family:var(--fd);font-size:14px">${it[0]}</b></div>
        <p class="small muted" style="margin-top:5px;line-height:1.75">${it[1]}</p></div>`).join(''); return }

  const bg=e.target.closest('[data-bg]');
  if(bg){ document.querySelectorAll('[data-bg]').forEach(b=>b.classList.remove('on')); bg.classList.add('on');
    document.getElementById('bg-body').innerHTML=badgoodHTML(+bg.dataset.bg); return }

  const pl=e.target.closest('[data-projlv]');
  if(pl){ projLv=+pl.dataset.projlv; router(); return }

  const acc=e.target.closest('[data-acc]');
  if(acc){ acc.parentElement.classList.toggle('open'); return }

  const mst=e.target.closest('[data-mastery]');
  if(mst){ const i=+mst.dataset.mastery; masterySel = masterySel===i?-1:i; router(); return }

  const md=e.target.closest('[data-model]');
  if(md){ const n=md.dataset.model;
    if(selModels.includes(n)){ if(selModels.length>1) selModels=selModels.filter(x=>x!==n) }
    else selModels=[selModels[selModels.length-1],n];
    router(); return }

  const cc=e.target.closest('[data-concept]');
  if(cc){ const n=cc.dataset.concept;
    if(selConcepts.includes(n)){ if(selConcepts.length>1) selConcepts=selConcepts.filter(x=>x!==n) }
    else selConcepts=[selConcepts[selConcepts.length-1],n];
    router(); return }

  const tone=e.target.closest('[data-tone]');
  if(tone){ document.querySelectorAll('[data-tone]').forEach(b=>b.classList.remove('on')); tone.classList.add('on'); return }

  const gen=e.target.closest('[data-act="pb-gen"]');
  if(gen){ buildPrompt(); return }

  const cp=e.target.closest('[data-copy]');
  if(cp){ const txt=document.getElementById(cp.dataset.copy).textContent;
    navigator.clipboard?.writeText(txt).then(()=>toast("نُسخ الأمر"),()=>toast("ما قدرنا ننسخ — حدّد النص يدوياً")); return }

  const clt=e.target.closest('[data-cl-toggle]');
  if(clt){ const c=clt.dataset.clToggle; hiddenCl[c]=!hiddenCl[c]; applyClusterFilter(); return }

  const z=e.target.closest('[data-zoom]');
  if(z){ const d=+z.dataset.zoom;
    if(d===0){ fitMap(true) } else { const v=document.getElementById('mapview');
      const nk=Math.min(1.6,Math.max(0.3,mapT.k*(d>0?1.2:0.83)));
      const cx=v.clientWidth/2, cy=v.clientHeight/2;
      mapT.x=cx-(cx-mapT.x)*(nk/mapT.k); mapT.y=cy-(cy-mapT.y)*(nk/mapT.k); mapT.k=nk; applyMapT(true) }
    return }

  const opt=e.target.closest('.opt');
  if(opt){
    const box=opt.closest('[data-quiz]'); if(!box||box.dataset.locked) return;
    const key=box.dataset.quiz, qi=+box.dataset.qi;
    const qs = TMAP[key]? TMAP[key].quiz : null; if(!qs) return;
    const q=qs[qi], chosen=+opt.dataset.oi;
    box.dataset.locked="1";
    box.querySelectorAll('.opt').forEach((o,i)=>{ o.classList.add('locked');
      if(i===q.a) o.classList.add('right'); else if(i===chosen) o.classList.add('wrong') });
    const why=box.querySelector('.why'); why.hidden=false;
    why.innerHTML = (chosen===q.a?"<b>إجابة صحيحة.</b> ":"<b>الإجابة الصحيحة هي "+["أ","ب","ج","د"][q.a]+".</b> ")+q.why;
    const all=[...document.querySelectorAll(`[data-quiz="${key}"]`)];
    if(all.every(b=>b.dataset.locked)){ if(!ST.quiz[key]){ ST.quiz[key]=Date.now(); save(); renderRing(); toast("أنهيت اختبار هذا الموضوع") } }
    return }
});

function buildPrompt(){
  const v=id=>document.getElementById(id).value.trim();
  const tone=document.querySelector('[data-tone].on')?.dataset.tone||"عملية مباشرة";
  const role=v('pb-role')||"خبير في المجال المطلوب";
  const goal=v('pb-goal')||"[اكتب الهدف]";
  const ctx=v('pb-ctx')||"[أضف السياق: الجمهور، الخلفية، البيانات]";
  const ins=v('pb-ins')||"١. حلّل المدخلات\n٢. نفّذ المطلوب\n٣. راجع النتيجة قبل الإخراج";
  const con=v('pb-con')||"لا تخترع أي معلومة غير موجودة في السياق. اذكر افتراضاتك إن وجدت.";
  const fmt=document.getElementById('pb-fmt').value;
  const out=`# الدور
أنت ${role}.

# الهدف
${goal}

# السياق
${ctx}

# التعليمات
${ins}

# القيود
${con}
النبرة: ${tone}.

# صيغة المخرجات
${fmt}

# قبل ما ترد
لو كان أي جزء من المطلوب غير واضح، اسأل سؤالاً واحداً محدداً بدل ما تفترض.`;
  document.getElementById('pb-out').textContent=out;
  toast("جاهز — انسخه واستخدمه");
}

/* ---------- البحث والتنقّل ---------- */
const qEl=document.getElementById('q');
let qT;
qEl.addEventListener('input',()=>{ clearTimeout(qT); qT=setTimeout(()=>{
  const v=qEl.value.trim();
  if(v.length>=2) location.hash="#/search/"+encodeURIComponent(v);
  else if(location.hash.startsWith("#/search")) location.hash="#/map";
},260)});
qEl.addEventListener('keydown',e=>{ if(e.key==="Escape"){ qEl.value=""; location.hash="#/map" }});
window.addEventListener('hashchange',router);
window.addEventListener('resize',()=>{ if((location.hash||"#/map")==="#/map"){ /* keep transform */ } });
router();
</script>

<!doctype html>
<html lang="ar"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head><body>
<title>ملعب التحكم بالكرة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<style>
/* Layout: full-screen pitch canvas, HUD strip on top, thumb controls at the bottom (left foot | joystick | right foot) */
:root{
  --bg:#0E1611; --panel:#16211A; --panel-2:#1D2B22; --line:#2B3D31; --fg:#E7EFE8; --muted:#A3B5A8;
  --grass:#2C6A43; --grass-2:#2A6440; --chalk:#F2F5EE; --move:#F28C3A; --trace:#F3DD6A;
  --ok:#5BD08A; --bad:#FF6B5E; --ballink:#1B2A21;
  --display:"Lalezar","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);margin:0;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);overflow:hidden;
  padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--trace);outline-offset:2px}

/* HUD */
.hud{display:flex;flex-direction:column;gap:6px;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.hud-top{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
.hud-title{font-family:var(--display);font-size:1.15rem;flex-basis:100%;line-height:1.1;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 100%;min-width:0}
.chip{font-size:.75rem;background:var(--panel-2);border:1px solid var(--line);border-radius:99px;padding:2px 10px;white-space:nowrap}
.icon-btn{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:.8rem;cursor:pointer;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stat{background:var(--panel-2);border-radius:8px;padding:3px 8px;min-width:0}
.stat b{display:block;font-size:1.05rem;font-variant-numeric:tabular-nums;line-height:1.3}
.stat span{font-size:.66rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.rhythm{height:5px;background:var(--panel-2);border-radius:3px;overflow:hidden;margin-top:3px}
.rhythm i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s}
.task{font-size:.88rem;color:var(--trace);min-height:1.4em;line-height:1.4}

/* Stage */
.stage{position:relative;min-height:0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);max-width:min(92%,520px);
  background:rgba(14,22,17,.92);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.88rem;line-height:1.5;
  text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.toast.bad{border-color:var(--bad)} .toast.good{border-color:var(--ok)}
.big{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-family:var(--display);
  font-size:clamp(3rem,14vw,6rem);color:var(--chalk);text-shadow:0 4px 20px rgba(0,0,0,.5)}

/* Controls */
.controls{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;background:var(--panel);border-top:1px solid var(--line);
  padding-top:10px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px));
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));touch-action:none}
.foot{height:clamp(84px,14vh,120px);border-radius:16px;border:2px solid var(--line);background:var(--panel-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;touch-action:none}
.foot strong{font-size:1.25rem} .foot small{font-size:.7rem;color:var(--muted)}
.foot.r{border-color:var(--move)} .foot.l{border-color:var(--chalk)}
.foot.down{transform:scale(.96);background:#26392C}
.foot.r.down{background:rgba(242,140,58,.25)}
.joy{width:clamp(96px,26vw,130px);aspect-ratio:1;border-radius:50%;background:var(--panel-2);border:2px dashed var(--line);position:relative;touch-action:none}
.joy i{position:absolute;width:42%;height:42%;left:29%;top:29%;border-radius:50%;background:var(--muted);opacity:.85}
.joy small{position:absolute;bottom:-2px;left:0;right:0;text-align:center;font-size:.65rem;color:var(--muted)}
/* left foot sits on the physical left, so controls stay LTR */
.controls{direction:ltr}

/* Overlays */
.overlay{position:fixed;inset:0;background:rgba(6,10,8,.72);display:grid;place-items:center;z-index:20;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(560px,100%);max-height:100%;overflow:auto;
  padding:18px;display:flex;flex-direction:column;gap:12px;-webkit-user-select:text;user-select:text}
.sheet h2{font-family:var(--display);font-weight:400;font-size:1.7rem;margin:0;line-height:1.2}
.sheet h3{font-size:.95rem;margin:0;color:var(--trace)}
.sheet p,.sheet li{font-size:.9rem;line-height:1.65;margin:0}
.sheet ol,.sheet ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:2px}
.eyebrow{font-size:.75rem;color:var(--muted);letter-spacing:.02em}
.note{background:var(--panel-2);border-radius:10px;padding:10px 12px;font-size:.84rem;color:var(--muted)}
.note b{color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--move);color:#1B120A;flex:1;min-width:140px}
.btn.ghost{background:var(--panel-2);color:var(--fg);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
table{width:100%;border-collapse:collapse;font-size:.86rem;font-variant-numeric:tabular-nums}
td{padding:6px 4px;border-bottom:1px solid var(--line)}
td:last-child{text-align:left;white-space:nowrap}
.ok{color:var(--ok)} .bad{color:var(--bad)}
.score{font-family:var(--display);font-size:2.4rem;line-height:1}
.prog-sec{display:flex;flex-direction:column;gap:4px}
.prog-item{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;padding:6px 8px;border-radius:8px;background:var(--panel-2)}
.prog-item.cur{outline:1px solid var(--move)}
.prog-item em{font-style:normal;color:var(--muted);font-size:.75rem;white-space:nowrap}
.kbd{font-family:ui-monospace,Menlo,monospace;font-size:.75rem;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:0 5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app" dir="rtl">
  <header class="hud">
    <div class="hud-top">
      <h1 class="hud-title" id="hudTitle">لمس الكرة من فوق · Toe Taps</h1>
      <span class="chip" id="hudPhase">التعليمات</span>
      <button class="icon-btn" id="btnInfo" type="button">التعليمات</button>
      <button class="icon-btn" id="btnProg" type="button">التقدّم</button>
      <button class="icon-btn" id="btnSound" type="button" aria-pressed="true">صوت</button>
    </div>
    <div class="stats">
      <div class="stat"><b id="sTime">0:40</b><span>الوقت</span></div>
      <div class="stat"><b id="sGood">0</b><span>لمسات صحيحة</span></div>
      <div class="stat"><b id="sErr">0</b><span>أخطاء</span></div>
      <div class="stat"><b id="sRhythm">–</b><span>انتظام الإيقاع</span><div class="rhythm"><i id="rhythmBar"></i></div></div>
    </div>
    <div class="task" id="task"></div>
  </header>

  <main class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="big" id="big"></div>
  </main>

  <footer class="controls" id="controls">
    <button class="foot l" id="footL" type="button" aria-label="القدم اليسار"><strong>يسار</strong><small>J أو ←</small></button>
    <div class="joy" id="joy" aria-label="تحريك اللاعب"><i id="joyKnob"></i><small>WASD</small></div>
    <button class="foot r" id="footR" type="button" aria-label="القدم اليمين"><strong>يمين</strong><small>K أو →</small></button>
  </footer>
</div>

<div class="overlay" id="ovBrief" hidden><div class="sheet" id="briefBody"></div></div>
<div class="overlay" id="ovResult" hidden><div class="sheet" id="resultBody"></div></div>
<div class="overlay" id="ovProg" hidden><div class="sheet" id="progBody"></div></div>

<script>
'use strict';
/* =====================================================================
   1. CONFIG — physical units are metres and seconds
   ===================================================================== */
const CFG = {
  BALL_R: 0.11,            // size-4 ball ≈ 22 cm across
  BODY_R: 0.10,
  COLLIDE: 0.21,           // body ↔ ball contact distance
  REACH: { min: 0.22, max: 0.46, lat: 0.17 }, // ball must sit in this box in front of the player to be touched
  LOST_DIST: 0.80,
  MOVE_SPEED: 1.5,
  FRICTION: 2.6,           // ball velocity decay per second
  HARD_MS: 300,            // a press longer than this is a hard touch that pushes the ball
  TOE_TAPS: {
    ROUND_S: 40, REST_S: 20, ROUNDS: 2,                 // file: Grimsby Town 40s work / 20s rest; beginner Saturday "×2"
    LEARN_STREAK: 10,
    PASS: { correct: 50, accuracy: 0.85, lostMax: 1, rhythmCv: 0.40 }, // game thresholds — the file gives no number for Toe Taps
    ORBIT: { seconds: 40, correct: 20 }
  }
};

/* =====================================================================
   2. PROGRAM — every drill from the file, in the file's order.
      playable:true only for drills built so far.
   ===================================================================== */
const PROGRAM = [
  { sec: '١) Ball Mastery والتحكم القريب', items: [
    { id: 'toe-taps', ar: 'لمس الكرة من فوق', en: 'Toe Taps', playable: true },
    { id: 'sole-rolls', ar: 'دحرجة بالنعل', en: 'Sole Rolls' },
    { id: 'tick-tock', ar: 'تك توك', en: 'Tick-Tock / Bell Touches' },
    { id: 'inside-outside', ar: 'داخل وخارج نفس القدم', en: 'Inside-Outside' },
    { id: 'v-pull', ar: 'سحب على شكل V', en: 'V-Pull' },
    { id: 'l-turn', ar: 'لفة L', en: 'L-Turn' },
    { id: 'pull-push', ar: 'سحب ودفع', en: 'Pull-Push' },
    { id: 'cruyff', ar: 'لفة كرويف في المكان', en: 'Cruyff Turn' },
    { id: 'drag-back', ar: 'لفة 180 درجة', en: 'Drag Back / Pull Turn' } ] },
  { sec: '٢) اللمسة الأولى والاستلام على الجدار', items: [
    { id: 'wall-two', ar: 'لمستين على الجدار', en: 'Two-Touch' },
    { id: 'wall-one', ar: 'لمسة وحدة', en: 'One-Touch' },
    { id: 'surfaces', ar: 'استلام بأجزاء مختلفة من القدم', en: 'Inside / Outside / Sole / Back Foot' },
    { id: 'thigh', ar: 'التحكم بالفخذ', en: 'Thigh' },
    { id: 'chest', ar: 'التحكم بالصدر', en: 'Chest' },
    { id: 'instep', ar: 'الكرة الطايحة بوجه القدم', en: 'Instep' } ] },
  { sec: '٣) تدرّج الـ Juggling', items: [
    { id: 'jug-0', ar: 'المستوى 0', en: 'Juggling L0' }, { id: 'jug-1', ar: 'المستوى 1', en: 'Juggling L1' },
    { id: 'jug-2', ar: 'المستوى 2', en: 'Juggling L2' }, { id: 'jug-3', ar: 'المستوى 3', en: 'Juggling L3' },
    { id: 'jug-4', ar: 'المستوى 4', en: 'Juggling L4' }, { id: 'jug-5', ar: 'المستوى 5', en: 'Juggling L5' } ] },
  { sec: '٤) تمارين كرة التنس (اختيارية للمتقدمين)', items: [
    { id: 'tennis-mastery', ar: 'Toe Taps وSole Rolls بكرة تنس', en: 'Tennis ball' },
    { id: 'tennis-jug', ar: 'Juggling بكرة التنس بتنطيطة بين كل لمسة', en: 'Tennis ball' },
    { id: 'tennis-wall', ar: 'تمرير كرة التنس على الجدار واستلامها بداخل القدم', en: 'Tennis ball' } ] },
  { sec: '٧) اختبارات قياس التطور', items: [
    { id: 't-toetaps', ar: 'Toe Taps في 30 ث', en: 'Test' }, { id: 't-ticktock', ar: 'Tick-Tock في 30 ث', en: 'Test' },
    { id: 't-jugrec', ar: 'رقم Juggling القياسي (أفضل 3 محاولات)', en: 'Test' },
    { id: 't-jugalt', ar: 'Juggling بالتبادل في 60 ث', en: 'Test' },
    { id: 't-wall', ar: 'تمرير الجدار في 60 ث', en: 'Test' },
    { id: 't-video', ar: 'فيديو دقيقة واحدة', en: 'خارج اللعبة' } ] }
];

/* =====================================================================
   3. STORAGE — per-device progress, every access guarded
   ===================================================================== */
const Store = {
  key: 'ball-control-game.v1',
  load() { try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch { return {}; } },
  save(d) { try { localStorage.setItem(this.key, JSON.stringify(d)); } catch { /* storage unavailable */ } }
};
const progress = Store.load();
function rec(id) { return progress[id] || (progress[id] = { attempts: 0, completed: false, best: 0, bestCorrect: 0, orbitDone: false, last: null }); }

/* =====================================================================
   4. VECTOR HELPERS
   ===================================================================== */
const V = {
  add: (a, b) => ({ x: a.x + b.x, y: a.y + b.y }), sub: (a, b) => ({ x: a.x - b.x, y: a.y - b.y }),
  mul: (a, k) => ({ x: a.x * k, y: a.y * k }), dot: (a, b) => a.x * b.x + a.y * b.y,
  len: a => Math.hypot(a.x, a.y), lerp: (a, b, t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t })
};
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const angDiff = (a, b) => { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };

/* =====================================================================
   5. WORLD — player, feet, ball. Screen "up" is the player's start facing.
      facing θ: 0 = up (−y). forward f = (sinθ, −cosθ), right r = (cosθ, sinθ)
   ===================================================================== */
const world = {
  player: { p: { x: 0, y: 1.6 }, v: { x: 0, y: 0 }, th: 0, hop: 0 },
  ball: { p: { x: 0, y: 0 }, v: { x: 0, y: 0 }, spin: 0 },
  feet: { L: { ext: 0, down: false, target: null, flash: 0 }, R: { ext: 0, down: false, target: null, flash: 0 } },
  rings: [],         // short-lived touch markers
  bounds: 3.6
};
function fwd(th) { return { x: Math.sin(th), y: -Math.cos(th) }; }
function right(th) { return { x: Math.cos(th), y: Math.sin(th) }; }
function ballLocal() {
  const pl = world.player, d = V.sub(world.ball.p, pl.p);
  return { df: V.dot(d, fwd(pl.th)), dl: V.dot(d, right(pl.th)), dist: V.len(d) };
}
function ballInReach() {
  const b = ballLocal();
  return b.df >= CFG.REACH.min && b.df <= CFG.REACH.max && Math.abs(b.dl) <= CFG.REACH.lat;
}
function footRest(side) {
  const pl = world.player, f = fwd(pl.th), r = right(pl.th);
  return V.add(pl.p, V.add(V.mul(f, 0.04), V.mul(r, side === 'R' ? 0.1 : -0.1)));
}
function resetWorld() {
  Object.assign(world.player, { p: { x: 0, y: 1.6 }, v: { x: 0, y: 0 }, th: 0, hop: 0 });
  Object.assign(world.ball, { p: { x: 0, y: 0 }, v: { x: 0, y: 0 }, spin: 0 });
  world.rings.length = 0;
}

function stepWorld(dt, move) {
  const pl = world.player, b = world.ball;
  // player movement (screen-relative)
  const want = V.mul(move, CFG.MOVE_SPEED);
  pl.v = V.lerp(pl.v, want, clamp(dt * 12, 0, 1));
  pl.p = V.add(pl.p, V.mul(pl.v, dt));
  pl.p.x = clamp(pl.p.x, -world.bounds, world.bounds); pl.p.y = clamp(pl.p.y, -world.bounds, world.bounds);
  // facing: look at the ball when close, else along movement
  const toBall = V.sub(b.p, pl.p), dist = V.len(toBall);
  let target = null;
  if (dist < 1.3 && dist > 0.05) target = Math.atan2(toBall.x, -toBall.y);
  else if (V.len(pl.v) > 0.1) target = Math.atan2(pl.v.x, -pl.v.y);
  if (target !== null) pl.th += clamp(angDiff(pl.th, target), -9 * dt, 9 * dt);
  // body ↔ ball contact: walking into the ball pushes it
  if (dist < CFG.COLLIDE && dist > 1e-4) {
    const n = V.mul(toBall, 1 / dist);
    b.p = V.add(pl.p, V.mul(n, CFG.COLLIDE));
    const vn = V.dot(pl.v, n);
    if (vn > 0) b.v = V.add(b.v, V.mul(n, vn * 1.05 - V.dot(b.v, n)));
  }
  // ball rolling
  b.p = V.add(b.p, V.mul(b.v, dt));
  b.spin += V.len(b.v) * dt / CFG.BALL_R;
  b.v = V.mul(b.v, Math.exp(-CFG.FRICTION * dt));
  for (const k of ['x', 'y']) {
    if (Math.abs(b.p[k]) > world.bounds) { b.p[k] = Math.sign(b.p[k]) * world.bounds; b.v[k] *= -0.5; }
  }
  // feet animation
  for (const s of ['L', 'R']) {
    const ft = world.feet[s];
    ft.ext = clamp(ft.ext + (ft.down ? 1 : -1) * dt / 0.08, 0, 1);
    ft.flash = Math.max(0, ft.flash - dt);
  }
  pl.hop = Math.max(0, pl.hop - dt);
  world.rings = world.rings.filter(r => (r.t -= dt) > 0);
}

/* =====================================================================
   6. INPUT — two foot buttons (press/release timing), joystick, keyboard
   ===================================================================== */
const input = { keys: new Set(), joy: { id: null, x: 0, y: 0 }, press: { L: null, R: null } };
function moveVector() {
  let x = input.joy.x, y = input.joy.y;
  const k = input.keys;
  if (k.has('KeyA')) x -= 1; if (k.has('KeyD')) x += 1; if (k.has('KeyW')) y -= 1; if (k.has('KeyS')) y += 1;
  const l = Math.hypot(x, y);
  return l > 1 ? { x: x / l, y: y / l } : { x, y };
}
function footDown(side) {
  if (input.press[side]) return;
  Sound.unlock();
  const inReach = ballInReach();
  input.press[side] = { t0: performance.now(), inReach };
  const ft = world.feet[side];
  ft.down = true;
  ft.target = inReach ? 'ball' : 'air';
  world.player.hop = 0.16;
  Game.drill && Game.drill.onPress && Game.drill.onPress(side, inReach);
  setFootBtn(side, true);
}
function footUp(side) {
  const pr = input.press[side]; if (!pr) return;
  input.press[side] = null;
  world.feet[side].down = false;
  setFootBtn(side, false);
  const dur = performance.now() - pr.t0;
  Game.drill && Game.drill.onTap && Game.drill.onTap({ side, t0: pr.t0 / 1000, dur, inReach: pr.inReach });
}
function setFootBtn(side, on) { document.getElementById(side === 'L' ? 'footL' : 'footR').classList.toggle('down', on); }

function bindFootButton(el, side) {
  el.addEventListener('pointerdown', e => { e.preventDefault(); el.setPointerCapture(e.pointerId); footDown(side); });
  const up = e => { e.preventDefault(); footUp(side); };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('lostpointercapture', up);
  el.addEventListener('contextmenu', e => e.preventDefault());
}
bindFootButton(document.getElementById('footL'), 'L');
bindFootButton(document.getElementById('footR'), 'R');

(function bindJoystick() {
  const el = document.getElementById('joy'), knob = document.getElementById('joyKnob');
  const set = (cx, cy) => {
    const r = el.getBoundingClientRect(), R = r.width / 2;
    let dx = cx - (r.left + R), dy = cy - (r.top + R); const l = Math.hypot(dx, dy);
    if (l > R) { dx *= R / l; dy *= R / l; }
    input.joy.x = Math.abs(dx / R) < 0.12 ? 0 : dx / R; input.joy.y = Math.abs(dy / R) < 0.12 ? 0 : dy / R;
    knob.style.transform = `translate(${dx * 0.6}px,${dy * 0.6}px)`;
  };
  const reset = () => { input.joy.id = null; input.joy.x = input.joy.y = 0; knob.style.transform = ''; };
  el.addEventListener('pointerdown', e => { e.preventDefault(); el.setPointerCapture(e.pointerId); input.joy.id = e.pointerId; Sound.unlock(); set(e.clientX, e.clientY); });
  el.addEventListener('pointermove', e => { if (e.pointerId === input.joy.id) set(e.clientX, e.clientY); });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => el.addEventListener(t, e => { if (e.pointerId === input.joy.id) reset(); }));
})();

const FOOT_KEYS = { KeyJ: 'L', ArrowLeft: 'L', KeyK: 'R', ArrowRight: 'R' };
const MOVE_KEYS = { ArrowUp: 'KeyW', ArrowDown: 'KeyS' };
addEventListener('keydown', e => {
  if (anyOverlayOpen()) return;
  if (FOOT_KEYS[e.code]) { e.preventDefault(); if (!e.repeat) footDown(FOOT_KEYS[e.code]); return; }
  const code = MOVE_KEYS[e.code] || e.code;
  if (['KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(code)) { e.preventDefault(); input.keys.add(code); }
});
addEventListener('keyup', e => {
  if (FOOT_KEYS[e.code]) { footUp(FOOT_KEYS[e.code]); return; }
  input.keys.delete(MOVE_KEYS[e.code] || e.code);
});
addEventListener('blur', () => { input.keys.clear(); footUp('L'); footUp('R'); });
document.addEventListener('gesturestart', e => e.preventDefault()); // iOS pinch-zoom

/* =====================================================================
   7. SOUND — tiny WebAudio clicks, started from a user gesture
   ===================================================================== */
const Sound = {
  ctx: null, on: true,
  unlock() { if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch { this.on = false; } } if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  beep(freq, dur = 0.05, vol = 0.12, type = 'triangle') {
    if (!this.on || !this.ctx) return;
    const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.value = freq; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + dur);
  },
  good() { this.beep(880, 0.05); }, bad() { this.beep(180, 0.14, 0.14, 'square'); }, tick() { this.beep(1320, 0.03, 0.06); },
  win() { [660, 880, 1100].forEach((f, i) => setTimeout(() => this.beep(f, 0.12, 0.12), i * 110)); }
};

const $ = id => document.getElementById(id);
let toastTimer = 0;
function toast(msg, kind = '') {
  const el = $('toast'); el.textContent = msg; el.className = 'toast show ' + kind;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.className = 'toast ' + kind, 2200);
}
function big(text, ms = 700) { const el = $('big'); el.textContent = text; if (ms) setTimeout(() => { if (el.textContent === text) el.textContent = ''; }, ms); }
function fmt(s) { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function anyOverlayOpen() { return !$('ovBrief').hidden || !$('ovResult').hidden || !$('ovProg').hidden; }
function openOverlay(id) { ['ovBrief', 'ovResult', 'ovProg'].forEach(o => $(o).hidden = o !== id); input.keys.clear(); }
function closeOverlays() { ['ovBrief', 'ovResult', 'ovProg'].forEach(o => $(o).hidden = true); }

/* =====================================================================
   9. DRILL: Toe Taps — file section 1(a)
      Phases: setup → learn → round(1) → rest → round(2) → result
              optional: orbit (file step 5 "تطوير: دُر حول الكرة")
   ===================================================================== */
const MSG = {
  same: 'نفس القدم مرتين. الملف: بدّل القدمين بنطة خفيفة، اليسار فوق الكرة واليمين تنزل الأرض.',
  hard: 'لمسة قوية دفعت الكرة. الملف: خل الكرة ثابتة تقريباً، الهدف إيقاع منتظم مو قوة.',
  air: 'لمست الهوا: الكرة مو قدامك. الملف: حط الكرة قدامك.',
  lost: 'الكرة راحت بعيد. رجّعها قدامك بالتحريك وكمّل.',
  start: 'ابدأ باليمين. الملف: حط مقدمة نعل قدمك اليمين على أعلى الكرة بخفة.'
};

function ToeTaps() {
  const C = CFG.TOE_TAPS;
  const d = {
    id: 'toe-taps', phase: 'setup', t: 0, round: 0, zoneHold: 0,
    lastFoot: null, streak: 0, lostNow: false,
    stats: null, all: null, orbit: null
  };
  const newStats = () => ({ total: 0, correct: 0, same: 0, hard: 0, air: 0, lost: 0, presses: [] });

  d.title = 'لمس الكرة من فوق · Toe Taps';
  d.start = () => {
    resetWorld();
    Object.assign(d, { phase: 'setup', t: 0, round: 0, zoneHold: 0, lastFoot: null, streak: 0, lostNow: false, stats: newStats(), all: newStats(), orbit: null, activeTime: 0 });
    setPhase('setup');
  };
  d.restartRounds = () => {     // retry skips the tutorial
    resetWorld(); world.player.p = { x: 0, y: 0.3 };
    Object.assign(d, { lastFoot: null, lostNow: false, all: newStats(), activeTime: 0, orbit: null });
    beginRound(1);
  };

  function setPhase(p) {
    d.phase = p;
    const names = { setup: 'الخطوة 1', learn: 'تعلّم الحركة', round: `الجولة ${d.round} من ${C.ROUNDS}`, rest: 'راحة', orbit: 'التطوير', done: 'النتيجة' };
    $('hudPhase').textContent = names[p] || p;
  }
  function beginRound(n) {
    d.round = n; d.t = C.ROUND_S; d.stats = newStats(); d.lastFoot = null; d.all.presses.push(null);
    if (n === 1) rec(d.id).attempts++, Store.save(progress);
    setPhase('round'); big('ابدأ', 700); Sound.win();
  }
  function rhythmCv(presses) {
    // null marks a round boundary; long pauses (ball retrieval) are not part of the rhythm
    const iv = []; for (let i = 1; i < presses.length; i++) {
      if (presses[i] === null || presses[i - 1] === null) continue;
      const x = presses[i] - presses[i - 1]; if (x < 2.5) iv.push(x);
    }
    if (iv.length < 5) return null;
    const m = iv.reduce((a, b) => a + b, 0) / iv.length;
    const sd = Math.sqrt(iv.reduce((a, b) => a + (b - m) ** 2, 0) / iv.length);
    return sd / m;
  }
  d.rhythmCv = rhythmCv;

  function err(kind, side) {
    const s = d.stats; if (s) s[kind]++; if (d.all && (d.phase === 'round')) d.all[kind]++;
    world.rings.push({ p: kind === 'air' ? footTipAir(side) : { ...world.ball.p }, t: 0.45, ok: false });
    world.feet[side].flash = 0.3;
    Sound.bad(); toast(MSG[kind], 'bad');
  }
  function footTipAir(side) { const pl = world.player; return V.add(footRest(side), V.mul(fwd(pl.th), 0.3)); }

  d.onTap = ({ side, t0, dur, inReach }) => {
    if (d.phase === 'done') return;
    const counting = d.phase === 'round' || d.phase === 'orbit';
    const S = counting ? d.stats : null;
    if (S) { S.total++; S.presses.push(t0); if (d.phase === 'round') { d.all.total++; d.all.presses.push(t0); } }

    if (!inReach) { if (counting) err('air', side); else { Sound.bad(); toast(MSG.air, 'bad'); } d.streak = 0; return; }

    const f = fwd(world.player.th);
    let ok = true;
    if (dur > CFG.HARD_MS) {                       // hard touch pushes the ball away
      const sp = clamp(0.9 + (dur - CFG.HARD_MS) / 400, 0.9, 2.6);
      world.ball.v = V.add(world.ball.v, V.mul(f, sp));
      if (counting) err('hard', side); else { Sound.bad(); toast(MSG.hard, 'bad'); }
      ok = false;
    } else {                                       // light tap: a tiny nudge, the ball stays almost still
      const nudge = 0.004 + 0.015 * (dur / CFG.HARD_MS);
      world.ball.v = V.add(world.ball.v, V.add(V.mul(f, nudge), V.mul(right(world.player.th), (Math.random() - 0.5) * 0.012)));
    }
    if (ok && d.lastFoot === side) {
      if (counting) err('same', side); else { Sound.bad(); toast(MSG.same, 'bad'); }
      ok = false;
    }
    if (ok && d.phase === 'learn' && d.lastFoot === null && side !== 'R') { Sound.bad(); toast(MSG.start, 'bad'); d.streak = 0; return; }
    d.lastFoot = side;

    if (ok) {
      if (S) { S.correct++; if (d.phase === 'round') d.all.correct++; }
      world.rings.push({ p: { ...world.ball.p }, t: 0.35, ok: true });
      Sound.good();
      if (d.phase === 'learn') {
        d.streak++;
        if (d.streak >= C.LEARN_STREAK) { toast('ممتاز. الحين جولات الشغل: 40 ثانية شغل و20 راحة، جولتين.', 'good'); setTimeout(() => d.phase === 'learn' && beginRound(1), 900); }
      }
    } else if (d.phase === 'learn') d.streak = 0;
  };

  d.update = dt => {
    const reach = ballInReach(), bl = ballLocal();
    // ball lost detection (only once per loss)
    if (bl.dist > CFG.LOST_DIST && !d.lostNow) {
      d.lostNow = true;
      if (d.phase === 'round' || d.phase === 'orbit') { d.stats.lost++; if (d.phase === 'round') d.all.lost++; Sound.bad(); }
      toast(MSG.lost, 'bad'); d.streak = 0; d.lastFoot = null;
    } else if (d.lostNow && reach) d.lostNow = false;

    switch (d.phase) {
      case 'setup':
        d.zoneHold = reach && V.len(world.player.v) < 0.4 ? d.zoneHold + dt : 0;
        if (d.zoneHold > 0.5) { setPhase('learn'); d.lastFoot = null; d.streak = 0; Sound.win(); toast('الكرة قدامك. الحين المس أعلاها بالقدم اليمين.', 'good'); }
        break;
      case 'round':
        d.t -= dt; d.activeTime += dt;
        if (d.t <= 3 && Math.ceil(d.t) !== Math.ceil(d.t + dt)) Sound.tick();
        if (d.t <= 0) {
          if (d.round < C.ROUNDS) { d.t = C.REST_S; setPhase('rest'); big('راحة', 900); }
          else finish();
        }
        break;
      case 'rest':
        d.t -= dt; if (d.t <= 0) beginRound(d.round + 1);
        break;
      case 'orbit': {
        d.t -= dt;
        const a = Math.atan2(world.player.p.x - world.ball.p.x, world.player.p.y - world.ball.p.y);
        if (d.orbit.prev !== null && bl.dist < 0.7) d.orbit.acc += angDiff(d.orbit.prev, a);
        d.orbit.prev = a;
        const done = Math.abs(d.orbit.acc) >= Math.PI * 2 && d.stats.correct >= C.ORBIT.correct;
        if (done || d.t <= 0) finishOrbit(done);
        break;
      }
    }
  };

  d.skipRest = () => { if (d.phase === 'rest') beginRound(d.round + 1); };

  d.startOrbit = () => {
    resetWorld(); world.player.p = { x: 0, y: 0.3 };
    Object.assign(d, { t: C.ORBIT.seconds, stats: newStats(), lastFoot: null, lostNow: false, orbit: { acc: 0, prev: null } });
    setPhase('orbit'); big('ابدأ', 700); Sound.win();
  };

  function evaluate() {
    const s = d.all, P = C.PASS, acc = s.total ? s.correct / s.total : 0, cv = rhythmCv(s.presses);
    const crit = [
      { label: `لمسات صحيحة (يسار/يمين بالتبادل، خفيفة، والكرة قدامك) ≥ ${P.correct}`, val: s.correct, ok: s.correct >= P.correct,
        tip: 'الملف: ابدأ ببطء وبحركة صحيحة، وبعدين زيد السرعة. حاول تحافظ على لمسات متواصلة طول الـ 40 ثانية.' },
      { label: `دقة اللمسات ≥ ${Math.round(P.accuracy * 100)}%`, val: Math.round(acc * 100) + '%', ok: acc >= P.accuracy,
        tip: s.same >= s.hard ? MSG.same : MSG.hard },
      { label: `الكرة ما راحت بعيد (مسموح ${P.lostMax})`, val: s.lost, ok: s.lost <= P.lostMax,
        tip: 'الملف: خل الكرة ثابتة تقريباً. اللمسة الخفيفة تحرك الكرة شوي، فعدّل مكانك بالتحريك لما تبعد.' },
      { label: `انتظام الإيقاع (تذبذب ≤ ${Math.round(P.rhythmCv * 100)}%)`, val: cv === null ? '–' : Math.round(cv * 100) + '%', ok: cv !== null && cv <= P.rhythmCv,
        tip: 'الملف: الهدف إيقاع منتظم مو قوة. خل الفرق بين كل لمسة والثانية متقارب.' }
    ];
    const pass = crit.every(c => c.ok);
    const rhythmBonus = cv === null ? 0 : Math.round(200 * clamp(1 - cv / P.rhythmCv, 0, 1));
    const score = Math.max(0, s.correct * 10 + Math.round(acc * 200) + rhythmBonus - s.lost * 50);
    return { pass, crit, score, acc, cv, s };
  }

  function finish() {
    setPhase('done');
    const r = evaluate(), R = rec(d.id);
    R.last = { pass: r.pass, score: r.score, correct: r.s.correct, total: r.s.total, same: r.s.same, hard: r.s.hard, air: r.s.air, lost: r.s.lost, time: Math.round(d.activeTime), at: Date.now() };
    if (r.pass) { R.completed = true; R.best = Math.max(R.best, r.score); R.bestCorrect = Math.max(R.bestCorrect, r.s.correct); Sound.win(); }
    else Sound.bad();
    Store.save(progress);
    showResult(d, r);
  }
  function finishOrbit(done) {
    setPhase('done');
    const R = rec(d.id); if (done) { R.orbitDone = true; Store.save(progress); Sound.win(); } else Sound.bad();
    showOrbitResult(d, done);
  }

  d.task = () => {
    switch (d.phase) {
      case 'setup': return 'الخطوة 1: حط الكرة قدامك. حرّك اللاعب لين تصير الكرة داخل المنطقة الصفراء قدام قدميك.';
      case 'learn': return `الخطوات 2–3: يمين، يسار، يمين… لمسات خفيفة بالتبادل. ${d.streak} / ${C.LEARN_STREAK} لمسات صحيحة متتالية`;
      case 'round': return edgeHint() || 'بدّل القدمين بلمسات خفيفة وإيقاع منتظم. خل الكرة ثابتة تقريباً.';
      case 'rest': return 'راحة 20 ثانية. الجولة الثانية تبدأ تلقائياً.';
      case 'orbit': return `التطوير: دُر حول الكرة وأنت تسوي Toe Taps. اللفة ${Math.min(100, Math.round(Math.abs(d.orbit.acc) / (2 * Math.PI) * 100))}% · لمسات ${d.stats.correct}/${C.ORBIT.correct}`;
      default: return '';
    }
  };
  function edgeHint() {
    const b = ballLocal();
    return ballInReach() && (b.df > CFG.REACH.max - 0.05 || Math.abs(b.dl) > CFG.REACH.lat - 0.04) ? 'الكرة قربت تطلع من مدى قدمك: قرّب خطوة صغيرة منها.' : '';
  }
  d.hud = () => {
    const s = d.stats || newStats();
    const timed = d.phase === 'round' || d.phase === 'rest' || d.phase === 'orbit';
    const cv = rhythmCv(s.presses.slice(-12));
    return {
      time: timed ? fmt(d.t) : '–',
      good: d.phase === 'learn' ? d.streak : s.correct,
      err: s.same + s.hard + s.air + s.lost,
      rhythm: cv === null ? null : clamp(1 - cv / 0.6, 0, 1)
    };
  };
  d.showZone = () => d.phase === 'setup' || d.lostNow || !ballInReach() || !!edgeHint();
  return d;
}

    <div class="eyebrow">التطوير · Toe Taps</div>
    <h2 class="${done ? 'ok' : 'bad'}">${done ? 'كملت لفة كاملة حول الكرة' : 'ما كملت اللفة في الوقت'}</h2>
    <p>لفيت ${Math.round(Math.abs(d.orbit.acc) / (2 * Math.PI) * 100)}% من دائرة، و${d.stats.correct} لمسة صحيحة (المطلوب ${CFG.TOE_TAPS.ORBIT.correct}).</p>
    ${done ? '' : '<p class="eyebrow">تحرك شوي شوي حول الكرة، واللاعب يلف وجهه للكرة تلقائياً. لا تبعد عنها.</p>'}
    <div class="row">
      <button class="btn" id="bOrbit2" type="button">أعد التطوير</button>
      <button class="btn ghost" id="bRetry2" type="button">أعد التمرين الأساسي</button>
    </div>`;
  openOverlay('ovResult');
  $('bOrbit2').onclick = () => { closeOverlays(); d.startOrbit(); };
  $('bRetry2').onclick = () => { closeOverlays(); d.restartRounds(); };
}

function showProgress() {
  const done = PROGRAM.flatMap(s => s.items).filter(i => rec(i.id).completed).length;
  const total = PROGRAM.reduce((n, s) => n + s.items.length, 0);
  $('progBody').innerHTML = `
    <div class="eyebrow">التقدّم في التدريب</div>
    <h2>${done} من ${total} تمرين مكتمل</h2>
    ${PROGRAM.map(sec => `<div class="prog-sec"><h3>${sec.sec}</h3>${sec.items.map(it => {
      const R = progress[it.id];
      const st = it.playable ? (R && R.completed ? `مكتمل · ${R.attempts} محاولات · أفضل ${R.best}` : `${R ? R.attempts : 0} محاولات`) : 'مقفل';
      return `<div class="prog-item ${it.id === Game.drill.id ? 'cur' : ''}"><span>${it.ar} <span class="eyebrow">${it.en}</span></span><em>${st}</em></div>`;
    }).join('')}</div>`).join('')}
    <p class="eyebrow">التمارين تنفتح بالترتيب، وكل تمرين يتطلب إكمال اللي قبله. التقدم محفوظ على هذا الجهاز بس.</p>
    <div class="row"><button class="btn" id="bClose" type="button">رجوع</button></div>`;
  openOverlay('ovProg');
  $('bClose').onclick = closeOverlays;
}

$('btnInfo').onclick = () => showBrief(false);
$('btnProg').onclick = showProgress;
$('btnSound').onclick = e => { Sound.on = !Sound.on; e.currentTarget.setAttribute('aria-pressed', Sound.on); e.currentTarget.textContent = Sound.on ? 'صوت' : 'صامت'; };
$('stage').addEventListener('click', () => { if (Game.drill && Game.drill.phase === 'rest') Game.drill.skipRest(); });

/* =====================================================================
   11. RENDERER — top-down pitch on canvas
   ===================================================================== */
const cv = $('cv'), ctx = cv.getContext('2d');
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COL = {};
function readColors() { for (const k of ['grass', 'grass-2', 'chalk', 'move', 'trace', 'ok', 'bad', 'ballink']) COL[k] = css('--' + k); }
let cam = { x: 0, y: 0.8, s: 100 };
function resize() {
  const r = cv.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2.5);
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cam.s = Math.min(r.width, r.height) / 2.5;
}
addEventListener('resize', resize);

function draw() {
  const w = cv.clientWidth, h = cv.clientHeight, pl = world.player, b = world.ball;
  const focus = V.lerp(pl.p, b.p, 0.5);
  cam.x += (focus.x - cam.x) * 0.08; cam.y += (focus.y - cam.y) * 0.08;
  ctx.save();
  ctx.fillStyle = COL.grass; ctx.fillRect(0, 0, w, h);
  ctx.translate(w / 2, h / 2); ctx.scale(cam.s, cam.s); ctx.translate(-cam.x, -cam.y);
  const px = 1 / cam.s;

  // mowing stripes, 1 m wide
  const vx0 = cam.x - w / 2 * px, vx1 = cam.x + w / 2 * px, vy0 = cam.y - h / 2 * px, vy1 = cam.y + h / 2 * px;
  ctx.fillStyle = COL['grass-2'];
  for (let y = Math.floor(vy0); y < vy1; y++) if ((y & 1) === 0) ctx.fillRect(vx0, y, vx1 - vx0, 1);
  // field boundary + 2×2 m training square (file: ~2×2 m for static drills)
  ctx.strokeStyle = COL.chalk; ctx.lineWidth = 3 * px; ctx.globalAlpha = 0.7;
  ctx.strokeRect(-world.bounds, -world.bounds, world.bounds * 2, world.bounds * 2);
  ctx.setLineDash([0.12, 0.1]); ctx.strokeRect(-1, -1, 2, 2); ctx.setLineDash([]); ctx.globalAlpha = 1;
  for (const [x, y] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) drawCone(x, y);
  ctx.fillStyle = COL.chalk; ctx.globalAlpha = .55; ctx.font = `${13 * px}px IBM Plex Sans Arabic, sans-serif`; ctx.textAlign = 'center';
  ctx.fillText('مساحة 2×2 م', 0, 1.18); ctx.globalAlpha = 1;

  // reach zone hint
  const d = Game.drill;
  if (d && d.showZone && d.showZone()) {
    const f = fwd(pl.th), r = right(pl.th);
    const c = (df, dl) => V.add(pl.p, V.add(V.mul(f, df), V.mul(r, dl)));
    const q = [c(CFG.REACH.min, -CFG.REACH.lat), c(CFG.REACH.max, -CFG.REACH.lat), c(CFG.REACH.max, CFG.REACH.lat), c(CFG.REACH.min, CFG.REACH.lat)];
    ctx.beginPath(); q.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.closePath();
    ctx.fillStyle = COL.trace; ctx.globalAlpha = ballInReach() ? 0.35 : 0.18; ctx.fill();
    ctx.globalAlpha = 0.9; ctx.strokeStyle = COL.trace; ctx.lineWidth = 2 * px; ctx.stroke(); ctx.globalAlpha = 1;
  }
  // orbit progress ring
  if (d && d.phase === 'orbit') {
    const frac = clamp(Math.abs(d.orbit.acc) / (Math.PI * 2), 0, 1);
    ctx.lineWidth = 5 * px; ctx.strokeStyle = COL.chalk; ctx.globalAlpha = .25;
    ctx.beginPath(); ctx.arc(b.p.x, b.p.y, 0.55, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1; ctx.strokeStyle = COL.trace;
    ctx.beginPath(); ctx.arc(b.p.x, b.p.y, 0.55, -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2); ctx.stroke();
  }
  // lost-ball arrow
  if (d && d.lostNow) {
    ctx.strokeStyle = COL.bad; ctx.lineWidth = 3 * px; ctx.setLineDash([0.08, 0.06]);
    ctx.beginPath(); ctx.moveTo(pl.p.x, pl.p.y); ctx.lineTo(b.p.x, b.p.y); ctx.stroke(); ctx.setLineDash([]);
  }

  drawBall(b);
  drawPlayer(pl);
  for (const r of world.rings) {
    ctx.strokeStyle = r.ok ? COL.ok : COL.bad; ctx.lineWidth = 3 * px; ctx.globalAlpha = clamp(r.t * 3, 0, 1);
    ctx.beginPath(); ctx.arc(r.p.x, r.p.y, CFG.BALL_R + (0.45 - r.t) * 0.4, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1;
  }
  ctx.restore();
}
function drawCone(x, y) {
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.arc(x + 0.02, y + 0.03, 0.09, 0, 7); ctx.fill();
  ctx.fillStyle = COL.move; ctx.beginPath(); ctx.arc(x, y, 0.09, 0, 7); ctx.fill();
  ctx.fillStyle = COL.chalk; ctx.beginPath(); ctx.arc(x, y, 0.035, 0, 7); ctx.fill();
}
function drawBall(b) {
  const R = CFG.BALL_R;
  ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(b.p.x + 0.03, b.p.y + 0.04, R, R * 0.8, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#FFFFFF'; ctx.strokeStyle = COL.ballink; ctx.lineWidth = 0.012;
  ctx.beginPath(); ctx.arc(b.p.x, b.p.y, R, 0, 7); ctx.fill(); ctx.stroke();
  ctx.save(); ctx.beginPath(); ctx.arc(b.p.x, b.p.y, R, 0, 7); ctx.clip();
  ctx.fillStyle = COL.ballink;
  pent(b.p.x, b.p.y, R * 0.3, b.spin);
  for (let k = 0; k < 5; k++) {
    const a = b.spin + k * 2 * Math.PI / 5;
    pent(b.p.x + Math.cos(a) * R * 0.85, b.p.y + Math.sin(a) * R * 0.85, R * 0.24, a);
  }
  ctx.restore();
}
function pent(x, y, r, rot) { ctx.beginPath(); for (let k = 0; k < 5; k++) { const a = rot + k * 2 * Math.PI / 5; ctx[k ? 'lineTo' : 'moveTo'](x + Math.cos(a) * r, y + Math.sin(a) * r); } ctx.fill(); }

function drawPlayer(pl) {
  const f = fwd(pl.th), r = right(pl.th), hop = pl.hop > 0 ? Math.sin((0.16 - pl.hop) / 0.16 * Math.PI) : 0;
  const k = 1 + hop * 0.06;
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(pl.p.x + 0.04, pl.p.y + 0.06, 0.26, 0.17, pl.th, 0, 7); ctx.fill();
  // feet
  for (const s of ['L', 'R']) {
    const ft = world.feet[s], rest = footRest(s);
    let tgt;
    if (ft.target === 'ball') tgt = V.sub(world.ball.p, V.mul(f, 0.07));
    else tgt = V.add(rest, V.mul(f, 0.26));
    const e = ft.ext * ft.ext * (3 - 2 * ft.ext);
    const p = V.lerp(rest, tgt, e);
    const lift = 1 + e * 0.12;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(pl.th); ctx.scale(lift, lift);
    ctx.fillStyle = s === 'R' ? COL.move : '#F2F5EE';
    ctx.strokeStyle = ft.flash > 0 ? COL.bad : COL.ballink; ctx.lineWidth = ft.flash > 0 ? 0.025 : 0.012;
    ctx.beginPath(); ctx.ellipse(0, -0.02, 0.05, 0.125, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  // torso and head
  ctx.save(); ctx.translate(pl.p.x - f.x * 0.03, pl.p.y - f.y * 0.03); ctx.rotate(pl.th); ctx.scale(k, k);
  ctx.fillStyle = '#2F6FD6'; ctx.strokeStyle = COL.ballink; ctx.lineWidth = 0.012;
  ctx.beginPath(); ctx.ellipse(0, 0, 0.23, 0.12, 0, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#3A2A20'; ctx.beginPath(); ctx.arc(0, -0.01, 0.09, 0, 7); ctx.fill();
  ctx.fillStyle = '#C98E64'; ctx.beginPath(); ctx.arc(0, -0.065, 0.035, 0, 7); ctx.fill(); // face side shows facing
  ctx.restore();
  void r;
}

/* =====================================================================
   12. GAME LOOP
   ===================================================================== */
const Game = { drill: null, timeScale: 1 };
function updateHud() {
  const d = Game.drill; if (!d) return;
  const h = d.hud();
  $('sTime').textContent = h.time; $('sGood').textContent = h.good; $('sErr').textContent = h.err;
  $('sRhythm').textContent = h.rhythm === null ? '–' : Math.round(h.rhythm * 100) + '%';
  $('rhythmBar').style.width = (h.rhythm === null ? 0 : h.rhythm * 100) + '%';
  $('rhythmBar').style.background = h.rhythm !== null && h.rhythm < 0.4 ? COL.bad : COL.ok;
  $('task').textContent = d.task() + (d.phase === 'rest' ? ' (المس الملعب للتخطي)' : '');
}
let last = performance.now(), hudAcc = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000) * Game.timeScale; last = now;
  const paused = anyOverlayOpen();
  if (!paused) {
    stepWorld(dt, moveVector());
    Game.drill && Game.drill.update(dt);
  }
  draw();
  if ((hudAcc += dt) > 0.08 || paused) { hudAcc = 0; updateHud(); }
  requestAnimationFrame(frame);
}

function boot() {
  readColors(); resize();
  Game.drill = ToeTaps();
  $('hudTitle').textContent = Game.drill.title;
  resetWorld();
  showBrief(true);
  requestAnimationFrame(frame);
}
window.__game = { Game, world, CFG, input, footDown, footUp, ballInReach, progress };
if (document.fonts && document.fonts.ready) document.fonts.ready.then(boot, boot); else boot();
</script>

<!doctype html><html lang="ar"><body style="margin:0">
<style>
  .c-ground{fill:var(--surface)} .c-a{fill:var(--brand-strong)} .c-b{fill:var(--brand)} .c-c{fill:var(--accent)} .c-dot{fill:var(--brand)}
  .c-name{font:700 112px/1 var(--font-display);fill:var(--ink)} .c-tag{font:400 14px/20px var(--font-sans);fill:var(--ink-muted)}
</style>
<svg viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="كشتات" style="display:block">
<!--
blocks: brand-strong arch 180x210 (space steps), brand arch 144x190, accent arch 96x80; moon-dot 18 brand-sized dots over them
arrangement: three stepped arches rising from the bottom edge, tallest at left, staggered heights like dunes and tent doors
pattern: literal motif (tent door / dune arch), because the brand is camps in the desert; arcs built from half the block width as radius, plus a sparse star-dot grid at 24px pitch
steps/radii: 24px dot pitch, arch radii 90 / 72 / 48 = half block width
-->
<rect class="c-ground" width="960" height="300"/>
<path class="c-a" d="M480 300V120a90 90 0 0 1 180 0V300Z"/>
<path class="c-b" d="M672 300V182a72 72 0 0 1 144 0V300Z"/>
<path class="c-c" d="M828 300V268a48 48 0 0 1 96 0V300Z"/>
<g class="c-dot">
<circle cx="700" cy="36" r="3"/><circle cx="724" cy="36" r="3"/><circle cx="748" cy="36" r="3"/><circle cx="772" cy="36" r="3"/><circle cx="796" cy="36" r="3"/><circle cx="820" cy="36" r="3"/>
<circle cx="712" cy="60" r="3"/><circle cx="736" cy="60" r="3"/><circle cx="760" cy="60" r="3"/><circle cx="784" cy="60" r="3"/><circle cx="808" cy="60" r="3"/><circle cx="832" cy="60" r="3"/>
<circle cx="700" cy="84" r="3"/><circle cx="748" cy="84" r="3"/><circle cx="796" cy="84" r="3"/><circle cx="844" cy="84" r="3"/>
</g>
<text class="c-name" x="48" y="214">كشتات</text>
<text class="c-tag" x="48" y="256">احجز كشتتك أو مخيمك في الرياض من مكان واحد</text>
</svg></body></html>

<!-- @dsCard group="Forms" height=420 subtitle="حقول كبسولة، حالة تركيز وخطأ" -->
<!doctype html><html lang="ar" dir="rtl"><body style="margin:0">
<div class="k-root" style="padding:32px;display:grid;gap:16px;max-width:480px">
  <div class="k-field k-rise" style="--i:0"><label class="k-field__label" for="n">الاسم</label><input id="n" class="k-input" placeholder="اسمك الكامل"></div>
  <div class="k-field k-rise" style="--i:1"><label class="k-field__label" for="d">تاريخ الكشتة</label><input id="d" class="k-input" placeholder="اختر التاريخ"><span class="k-field__hint">الأسعار تختلف بين أيام الأسبوع والويكند.</span></div>
  <div class="k-field k-rise" style="--i:2"><label class="k-field__label" for="p">رقم الجوال</label><input id="p" class="k-input" aria-invalid="true" value="05"><span class="k-field__error">اكتب رقم جوال من 10 أرقام.</span></div>
  <div class="k-field k-rise" style="--i:3"><label class="k-field__label" for="m">ملاحظات للمالك</label><textarea id="m" class="k-input" placeholder="عدد الأشخاص، مناسبة، طلبات خاصة"></textarea></div>
</div></body></html>
